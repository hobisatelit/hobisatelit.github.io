<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IOD Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* Day / night themes — standard system fonts */
  :root, [data-theme="light"] {
    --bg:#f4f5f7;
    --panel:#ffffff;
    --panel-2:#eef0f3;
    --border:#d0d5dd;
    --text:#1a1d23;
    --accent:#2563eb;
    --accent-dim:#1d4ed8;
    --green:#15803d;
    --muted:#5c6570;
    --orange:#c2410c;
    --purple:#7c3aed;
    --ink:#f8f9fb;
    --view-bg:#e8eaee;
    --label-bg:rgba(255,255,255,.92);
    --touch-min:44px;
  }
  [data-theme="dark"] {
    --bg:#0f1218;
    --panel:#171b24;
    --panel-2:#222833;
    --border:#2e3644;
    --text:#e6e9ef;
    --accent:#60a5fa;
    --accent-dim:#3b82f6;
    --green:#4ade80;
    --muted:#94a3b8;
    --orange:#fb923c;
    --purple:#c084fc;
    --ink:#0b0e14;
    --view-bg:#080a0e;
    --label-bg:rgba(15,18,24,.92);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%; height:100dvh}
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }

  header{
    padding:10px 14px 12px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:10px;
    flex-shrink:0;
  }
  .title-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  header h1{
    font-size:1.15rem; font-weight:650;
    color:var(--accent);
    white-space:nowrap;
    margin:0;
  }
  header h1 span{
    font-weight:400; color:var(--muted); font-size:.72rem;
    margin-left:6px;
    letter-spacing:0.03em; text-transform:uppercase;
  }
  #btn-theme{
    min-width:44px; padding:8px 12px; font-size:1.1rem;
    line-height:1;
  }
  .controls{
    display:flex; gap:7px; align-items:center; flex-wrap:wrap;
    width:100%;
  }
  .settings-panel{
    background:var(--panel); border-bottom:1px solid var(--border);
    padding:6px 14px; flex-shrink:0; display:flex; flex-direction:column; gap:6px;
    overflow:auto; max-height:40vh;
  }
  .settings-panel.collapsed .settings-body{display:none}
  .settings-body{
    display:flex; flex-direction:column; gap:10px;
  }
  .settings-row{
    display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start;
  }
  button,select,input[type=number]{
    background:var(--panel-2); color:var(--text);
    border:1px solid var(--border);
    border-radius:6px;
    padding:8px 12px; font-size:.84rem; cursor:pointer;
    min-height:var(--touch-min);
    font-family:inherit;
  }
  button:hover{background:var(--border); border-color:var(--accent-dim)}
  button.active{
    background:var(--accent); color:#fff; font-weight:600;
    border-color:var(--accent);
  }
  [data-theme="light"] button.active{ color:#fff; }
  input[type=number]{width:72px}
  /* Station coords: no spinner arrows, wider for full values */
  input.coord-input{
    width:118px; min-width:100px;
    -moz-appearance:textfield;
    appearance:textfield;
  }
  input.coord-input::-webkit-outer-spin-button,
  input.coord-input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  label{font-size:.78rem;color:var(--muted)}
  .action-row{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    margin-top:4px;
  }
  .view-toolbar{
    position:absolute; top:8px; right:8px; z-index:25;
    display:flex; gap:4px;
  }
  .btn-fs{
    min-height:36px; min-width:36px; padding:6px 8px;
    font-size:.85rem; line-height:1;
    background:var(--label-bg); color:var(--text);
    border:1px solid var(--border); border-radius:6px;
    cursor:pointer;
  }
  .btn-fs:hover{border-color:var(--accent); color:var(--accent)}
  .view:fullscreen, .view:-webkit-full-screen{
    background:var(--view-bg);
  }
  .view:fullscreen #globe-container,
  .view:fullscreen #map,
  .view:fullscreen #sky-container,
  .view:-webkit-full-screen #globe-container,
  .view:-webkit-full-screen #map,
  .view:-webkit-full-screen #sky-container{
    bottom:0;
  }
  .view:fullscreen .view-resize,
  .view:-webkit-full-screen .view-resize{ display:none; }
  .slider-box{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
  .slider-box input[type=range]{width:100px; min-height:28px; accent-color:var(--accent)}
  .toggle-box{display:flex;gap:10px;align-items:center;font-size:.78rem;flex-wrap:wrap}
  .toggle-box label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text);
                    min-height:var(--touch-min); padding:4px 0}
  .toggle-box input[type=checkbox]{width:16px;height:16px; accent-color:var(--accent)}

  .input-panel{
    background:var(--panel); border-bottom:1px solid var(--border);
    padding:6px 14px; flex-shrink:0; display:flex; flex-direction:column; gap:6px;
    overflow:auto; max-height:32vh;
  }
  .input-panel.collapsed .input-body{display:none}
  .input-toggle{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    width:100%; background:transparent; border:none; color:var(--text);
    font-size:.88rem; font-weight:500; padding:6px 0; min-height:40px; cursor:pointer;
    font-family:inherit;
  }
  .input-toggle span.chevron{color:var(--muted); font-size:1rem}
  .input-body{display:flex;flex-direction:column;gap:8px}
  .input-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
  textarea{
    flex:1; min-width:200px; height:72px;
    background:var(--ink); color:var(--text);
    border:1px solid var(--border); border-radius:6px; padding:10px;
    font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    font-size:.78rem; resize:vertical; line-height:1.45;
  }
  .station-box{display:flex;flex-direction:column;gap:6px;min-width:240px;flex:1;max-width:100%}
  .station-box .field-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .station-list{
    display:flex; flex-direction:column; gap:4px; max-height:140px; overflow:auto;
    border:1px solid var(--border); border-radius:6px; padding:4px; background:var(--ink);
  }
  .station-row{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:6px 8px; border-radius:4px; font-size:.75rem;
    border:1px solid transparent; cursor:default;
  }
  .station-row.is-default{
    border-color:var(--accent); background:var(--panel-2);
  }
  .station-row .sid{ font-weight:600; min-width:3.2em; }
  .station-row button{
    min-height:28px; padding:4px 8px; font-size:.72rem;
  }
  .station-form{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:4px;
  }
  .station-form input.coord-input{ width:90px; }
  .station-form input#st-id{ width:72px; }
  #btn-clear-data{
    background:transparent; color:var(--orange); border-color:var(--orange);
  }
  #btn-clear-data:hover{ background:var(--orange); color:#fff; }
  .sat-list{display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem}
  .sat-item{
    background:var(--ink); border:1px solid var(--border); border-radius:6px;
    padding:8px 11px; min-width:140px; cursor:pointer;
    transition: opacity .15s, border-color .15s, filter .15s;
    user-select:none;
  }
  .sat-item:hover{ border-color:var(--accent); }
  .sat-item.hidden-sat{
    opacity:0.55; filter:grayscale(1);
    border-color:var(--border);
    background:var(--panel-2);
  }
  .sat-item .vis-hint{
    font-size:.65rem; color:var(--muted); margin-top:4px;
  }
  .sat-header{display:flex;align-items:center;gap:6px;margin-bottom:3px; font-size:.85rem}
  /* Sky view crosshair */
  .sky-crosshair{
    position:absolute; inset:0 0 14px 0; pointer-events:none; z-index:15;
  }
  .sky-crosshair::before, .sky-crosshair::after{
    content:''; position:absolute; background:rgba(239,68,68,.85);
  }
  .sky-crosshair::before{ /* horizontal */
    left:50%; top:50%; width:28px; height:2px;
    transform:translate(-50%, -50%);
  }
  .sky-crosshair::after{ /* vertical */
    left:50%; top:50%; width:2px; height:28px;
    transform:translate(-50%, -50%);
  }
  .sky-crosshair .ring{
    position:absolute; left:50%; top:50%;
    width:18px; height:18px; border:1.5px solid rgba(239,68,68,.7);
    border-radius:50%; transform:translate(-50%, -50%);
  }
  .dot{width:8px;height:8px;border-radius:50%}
  .param{font-size:.72rem; color:var(--muted)}
  .param span{color:var(--green)}
  .param .e{color:var(--purple)} .param .i{color:var(--orange)}
  .status{font-size:.8rem;color:var(--green); font-family:ui-monospace, Consolas, monospace}

  .view-tabs{
    display:flex; flex-shrink:0; background:var(--panel);
    border-bottom:1px solid var(--border); gap:0;
  }
  .view-tabs button{
    flex:1; border:none; border-radius:0; border-bottom:2px solid transparent;
    background:transparent; color:var(--muted); font-weight:500;
    padding:12px 8px; min-height:48px; font-size:.88rem;
  }
  .view-tabs button.active{
    color:var(--accent); border-bottom-color:var(--accent); background:var(--ink);
  }

  .views{
    flex:1 1 0;
    display:flex; flex-direction:column;
    min-height:0; overflow:hidden; position:relative;
  }
  .view{
    position:relative;
    background:var(--view-bg);
    border-bottom:1px solid var(--border);
    overflow:hidden; display:none;
    flex:1 1 0;
    min-height:0;
  }
  .view.active{ display:block; }
  #globe-container,#map,#sky-container{
    position:absolute; top:0; left:0; right:0; bottom:14px;
    width:100%; height:auto; touch-action:none;
  }
  .view-label{
    position:absolute; top:8px; left:8px;
    background:var(--label-bg);
    border:1px solid var(--border);
    padding:5px 10px; border-radius:6px;
    font-size:.7rem; z-index:20; pointer-events:none;
    color:var(--accent);
  }
  .view-hint{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--label-bg); padding:5px 12px; border-radius:6px;
    font-size:.68rem; color:var(--muted); z-index:20; pointer-events:none;
    white-space:nowrap; border:1px solid var(--border);
  }
  .view-resize{
    position:absolute; left:0; right:0; bottom:0;
    height:14px; z-index:30;
    cursor:ns-resize; touch-action:none;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
  }
  .view-resize::after{
    content:''; width:36px; height:3px; border-radius:2px;
    background:var(--border);
  }
  .view-resize:hover::after, .view-resize.dragging::after{
    background:var(--accent);
  }

  .time-bar{
    background:var(--panel); border-top:1px solid var(--border);
    padding:10px 14px; display:flex; align-items:center; gap:10px;
    flex-shrink:0; flex-wrap:wrap;
  }
  #time-slider{flex:1; min-width:100px; min-height:28px; accent-color:var(--accent)}
  #time-display{
    font-family:ui-monospace, Consolas, monospace; font-size:.78rem; min-width:0;
    color:var(--muted);
  }
  /* Small satellite name / NORAD tooltips on the map */
  .sat-label-tip{
    font-size:10px !important;
    line-height:1.2 !important;
    padding:2px 5px !important;
    border-radius:3px !important;
    background:var(--label-bg) !important;
    color:var(--text) !important;
    border:1px solid var(--border) !important;
    box-shadow:none !important;
    font-family:system-ui,Segoe UI,sans-serif !important;
  }
  .sat-label-tip::before{ display:none !important; }

  @media (min-width:700px), ((orientation:landscape) and (min-width:500px)){
    .view-tabs{display:none}
    .views{ overflow:hidden; flex:1 1 0; }
    .view{
      display:block !important;
      position:relative;
      flex:1 1 0;
      min-height:0;
    }
    .view-hint{display:none}
    .input-panel{max-height:22vh}
  }

  @media (max-width:699px) and (orientation:portrait){
    header{padding:6px 8px}
    header h1{font-size:1rem}
    button,select{padding:8px 10px; font-size:.8rem}
    .slider-box input[type=range]{width:80px}
    #time-display{font-size:.7rem; width:100%}
    .input-panel{max-height:36vh}
    .view.active{ flex:1 1 0; min-height:0; height:auto; }
  }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>IOD Tracker <span>make optical fun again</span></h1>
    <button type="button" id="btn-theme" title="Toggle day / night theme" aria-label="Toggle theme">☀</button>
  </div>
</header>

<div class="settings-panel collapsed" id="settings-panel">
  <button type="button" class="input-toggle" id="btn-toggle-settings" aria-expanded="false">
    <span>Settings</span>
    <span class="chevron" id="settings-chevron">▸</span>
  </button>
  <div class="settings-body" id="settings-body">
    <div class="settings-row">
      <div class="station-box">
        <label>Observation stations</label>
        <div class="station-list" id="station-list"></div>
        <div class="station-form">
          <label>ID <input type="text" id="st-id" class="coord-input" value="9999" autocomplete="off"></label>
          <label>Lat <input type="text" id="st-lat" class="coord-input" value="0" inputmode="decimal" autocomplete="off"></label>
          <label>Lon <input type="text" id="st-lon" class="coord-input" value="0" inputmode="decimal" autocomplete="off"></label>
          <label>Alt m <input type="text" id="st-alt" class="coord-input" value="0" inputmode="decimal" autocomplete="off"></label>
          <button type="button" id="btn-st-add" title="Add or update station">Add / Update</button>
        </div>
      </div>
    </div>
    <div class="controls">
      <div class="slider-box">
        <span>Sat size</span>
        <input type="range" id="sat-size-slider" min="0.15" max="3" value="0.35" step="0.05">
      </div>
      <div class="slider-box" title="Show stars brighter than this magnitude">
        <span>Mag &lt;</span>
        <input type="range" id="mag-slider" min="1" max="12" value="4" step="0.5">
        <span id="mag-label">4.0</span>
      </div>
      <div class="toggle-box">
        <label><input type="checkbox" id="tog-sat-labels" checked> Sat labels</label>
        <label><input type="checkbox" id="tog-const" checked> Constellations</label>
        <label><input type="checkbox" id="tog-bodies" checked> Sun/Moon</label>
        <label><input type="checkbox" id="tog-alt" checked> Altitude°</label>
      </div>
      <label style="font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer">
        Load stars
        <input type="file" id="star-file" accept=".csv,text/csv" style="font-size:.72rem;max-width:140px">
      </label>
      <span id="star-status" style="font-size:.75rem;color:var(--muted)"></span>
      <button type="button" id="btn-clear-data" title="Reset all saved data">Reset data</button>
    </div>
  </div>
</div>

<div class="input-panel" id="input-panel">
  <button type="button" class="input-toggle" id="btn-toggle-input" aria-expanded="true">
    <span>IOD / TLE input</span>
    <span class="chevron" id="input-chevron">▾</span>
  </button>
  <div class="input-body" id="input-body">
    <div class="input-row">
      <textarea id="iod-input" placeholder="Paste IOD lines and/or TLE (name + 2 lines). Example IOD or TLE:">69786 26 151Z   9999 G 20260916210304804 17 25 0254379-070853 37 S</textarea>
    </div>
    <div class="action-row">
      <label>Fallback Alt
        <input type="number" id="sat-alt" class="coord-input" value="500" min="150" max="45000" inputmode="decimal"> km
      </label>
      <button type="button" id="btn-parse">Parse &amp; Estimate</button>
      <button type="button" id="btn-play">Play</button>
      <select id="speed" title="Playback speed">
        <option value="0.2">0.2×</option>
        <option value="1" selected>1×</option>
        <option value="5">5×</option>
        <option value="10">10×</option>
        <option value="30">30×</option>
        <option value="60">60×</option>
        <option value="300">5 min/s</option>
        <option value="-1">−1×</option>
        <option value="-5">−5×</option>
        <option value="-30">−30×</option>
      </select>
      <div class="status" id="status">Ready</div>
    </div>
    <div class="sat-list" id="sat-list"></div>
  </div>
</div>

<nav class="view-tabs" id="view-tabs" role="tablist">
  <button type="button" class="active" data-view="globe" role="tab" aria-selected="true">Globe</button>
  <button type="button" data-view="map" role="tab" aria-selected="false">Map</button>
  <button type="button" data-view="sky" role="tab" aria-selected="false">Sky</button>
</nav>

<div class="views">
  <div class="view active" id="view-globe" data-view="globe">
    <div class="view-label">3D Globe</div>
    <div class="view-toolbar">
      <button type="button" class="btn-fs" data-fs="view-globe" title="Fullscreen">⛶</button>
    </div>
    <div id="globe-container"></div>
    <div class="view-hint">Drag to rotate · Pinch or scroll to zoom</div>
    <div class="view-resize" title="Drag to resize height"></div>
  </div>
  <div class="view" id="view-map" data-view="map">
    <div class="view-label">Ground Map</div>
    <div class="view-toolbar">
      <button type="button" class="btn-fs" data-fs="view-map" title="Fullscreen">⛶</button>
    </div>
    <div id="map"></div>
    <div class="view-hint">Pinch to zoom · Drag to pan</div>
    <div class="view-resize" title="Drag to resize height"></div>
  </div>
  <div class="view" id="view-sky" data-view="sky">
    <div class="view-label" id="sky-view-label">Sky View · FOV —°</div>
    <div class="view-toolbar">
      <button type="button" class="btn-fs" data-fs="view-sky" title="Fullscreen">⛶</button>
    </div>
    <div id="sky-container"></div>
    <div class="sky-crosshair" aria-hidden="true"><div class="ring"></div></div>
    <div class="view-hint">Drag to look around · Pinch or scroll to zoom</div>
    <div class="view-resize" title="Drag to resize height"></div>
  </div>
</div>

<div class="time-bar">
  <span id="time-display">—</span>
  <input type="range" id="time-slider" min="0" max="1000" value="0">
</div>

<script>
/* ============================================================
   Theme: system preference + manual day/night toggle
   ============================================================ */
// Hoisted so theme code never hits TDZ on let bindings
var scene=null, camera=null, renderer=null, earthGroup=null, globeStarMat=null;
var map=null, baseTileLayer=null, markersLayer=null, iodLayer=null, orbitLayer=null;
var skyScene=null, skyCamera=null, skyRenderer=null, skyGroundMat=null;
var skyStarGroup=null, skyConstGroup=null, skySatGroup=null, skyTrailGroup=null, skyLabelGroup=null, skyAltGroup=null;

function getThemeMode(){
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}

/** Update 3D globe / map / sky for day vs night (safe if views not ready) */
function applyThemeVisuals(){
  const day = getThemeMode() === 'light';
  const skyCol = day ? 0xf1f5f9 : 0x030712;   // light grey-white / deep night
  const globeBg = day ? 0xd1d5db : 0x000000;
  const groundCol = day ? 0x9ca3af : 0x000000;
  const starCol = day ? 0x4b5563 : 0xffffff;

  try {
    if (globeStarMat) globeStarMat.color.setHex(starCol);
    if (scene) scene.background = new THREE.Color(globeBg);
    if (renderer) renderer.setClearColor(globeBg, 1);
  } catch (e) { console.warn('theme globe', e); }

  try {
    if (map) {
      if (baseTileLayer) {
        try { map.removeLayer(baseTileLayer); } catch (e) {}
      }
      const url = day
        ? 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_3pnj_1_e9de23cbd8d3e0ce4979cf2f'
        : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_3pnj_1_e9de23cbd8d3e0ce4979cf2f';
      baseTileLayer = L.tileLayer(url, { attribution: '© OSM © CARTO', maxZoom: 18 });
      baseTileLayer.addTo(map);
      try {
        if (orbitLayer) orbitLayer.bringToFront();
        if (iodLayer) iodLayer.bringToFront();
        if (markersLayer) markersLayer.bringToFront();
      } catch (e) {}
    }
  } catch (e) { console.warn('theme map', e); }

  try {
    if (skyScene) skyScene.background = new THREE.Color(skyCol);
    if (skyRenderer) {
      skyRenderer.setClearColor(skyCol, 1);
      skyRenderer.setClearAlpha(1);
    }
    if (skyGroundMat) skyGroundMat.color.setHex(groundCol);
  } catch (e) { console.warn('theme sky', e); }

  // Redraw sky stars with day/night colours (only if data loaded)
  try {
    if (typeof updateSimulation === 'function' && maxTime > minTime) updateSimulation();
  } catch (e) { console.warn('theme sim', e); }
}

function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  const btn = document.getElementById('btn-theme');
  if (btn) {

/* ---- Persist IOD/TLE, station, settings (localStorage + cookies) ---- */
const STORE_KEY = 'iod-tracker-state-v1';
const COOKIE_DAYS = 365;

function setCookie(name, value, days){
  try {
    const max = 3500; // stay under typical cookie size limits
    let v = String(value);
    if (v.length > max) v = v.slice(0, max);
    const exp = new Date(Date.now() + (days || COOKIE_DAYS) * 864e5).toUTCString();
    document.cookie = name + '=' + encodeURIComponent(v) + ';expires=' + exp + ';path=/;SameSite=Lax';
  } catch (e) {}
}
function getCookie(name){
  try {
    const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  } catch (e) { return null; }
}

function collectAppState(){
  return {
    iodText: document.getElementById('iod-input')?.value ?? '',
    stations: (typeof stationList !== 'undefined' && stationList.length)
      ? stationList.map(s => ({ id: s.id, lat: s.lat, lon: s.lon, alt: s.alt }))
      : [{ id: '9999', lat: 0, lon: 0, alt: 0 }],
    defaultStationId: (typeof defaultStationId !== 'undefined') ? defaultStationId : '9999',
    satAlt: document.getElementById('sat-alt')?.value ?? '500',
    satSize: document.getElementById('sat-size-slider')?.value ?? '0.35',
    magLimit: document.getElementById('mag-slider')?.value ?? '4',
    speed: document.getElementById('speed')?.value ?? '1',
    togSatLabels: !!document.getElementById('tog-sat-labels')?.checked,
    togConst: !!document.getElementById('tog-const')?.checked,
    togBodies: !!document.getElementById('tog-bodies')?.checked,
    togAlt: !!document.getElementById('tog-alt')?.checked,
    theme: getThemeMode()
  };
}

function saveAppState(){
  const state = collectAppState();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) { console.warn('localStorage save failed', e); }
  // Cookies for default station + settings (IOD text may be too large)
  const def = (state.stations || []).find(s => s.id === state.defaultStationId) || (state.stations || [])[0];
  if (def) {
    setCookie('iod_obs_lat', def.lat);
    setCookie('iod_obs_lon', def.lon);
    setCookie('iod_obs_alt', def.alt);
    setCookie('iod_st_id', def.id);
  }
  setCookie('iod_sat_alt', state.satAlt);
  setCookie('iod_sat_size', state.satSize);
  setCookie('iod_mag', state.magLimit);
  setCookie('iod_speed', state.speed);
  setCookie('iod_theme', state.theme);
  setCookie('iod_tog', [state.togSatLabels, state.togConst, state.togBodies, state.togAlt].map(x => x ? '1' : '0').join(''));
  if (state.iodText.length <= 3000) setCookie('iod_text', state.iodText);
  try {
    setCookie('iod_stations', JSON.stringify(state.stations).slice(0, 3500));
  } catch (e) {}
}

function loadAppState(){
  let state = null;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) {}
  // Fallback from cookies if no localStorage
  if (!state) {
    const lat = getCookie('iod_obs_lat');
    if (lat != null || getCookie('iod_text') || getCookie('iod_stations')) {
      state = {
        satAlt: getCookie('iod_sat_alt') || '500',
        satSize: getCookie('iod_sat_size') || '0.35',
        magLimit: getCookie('iod_mag') || '4',
        speed: getCookie('iod_speed') || '1',
        theme: getCookie('iod_theme') || null,
        iodText: getCookie('iod_text') || null,
        defaultStationId: getCookie('iod_st_id') || '9999',
        stations: null,
        togSatLabels: true, togConst: true, togBodies: true, togAlt: true
      };
      try {
        const sj = getCookie('iod_stations');
        if (sj) state.stations = JSON.parse(sj);
      } catch (e) {}
      if (!state.stations) {
        state.stations = [{
          id: getCookie('iod_st_id') || '9999',
          lat: parseFloat(getCookie('iod_obs_lat') || '0') || 0,
          lon: parseFloat(getCookie('iod_obs_lon') || '0') || 0,
          alt: parseFloat(getCookie('iod_obs_alt') || '0') || 0
        }];
      }
      const tog = getCookie('iod_tog');
      if (tog && tog.length >= 4) {
        state.togSatLabels = tog[0] === '1';
        state.togConst = tog[1] === '1';
        state.togBodies = tog[2] === '1';
        state.togAlt = tog[3] === '1';
      }
    }
  }
  if (!state) return false;

  const setVal = (id, v) => {
    const el = document.getElementById(id);
    if (el && v != null && v !== '') el.value = v;
  };
  if (state.iodText != null && state.iodText !== '') setVal('iod-input', state.iodText);
  setVal('sat-alt', state.satAlt);
  setVal('sat-size-slider', state.satSize);
  setVal('mag-slider', state.magLimit);
  setVal('speed', state.speed);
  const magLabel = document.getElementById('mag-label');
  if (magLabel && state.magLimit != null) magLabel.textContent = (+state.magLimit).toFixed(1);

  // Stations
  if (Array.isArray(state.stations) && state.stations.length) {
    stationList = state.stations.map(s => ({
      id: String(s.id),
      lat: parseFloat(s.lat) || 0,
      lon: parseFloat(s.lon) || 0,
      alt: parseFloat(s.alt) || 0
    }));
    defaultStationId = String(state.defaultStationId || stationList[0].id);
    if (!stationList.find(s => s.id === defaultStationId)) defaultStationId = stationList[0].id;
  } else if (state.obsLat != null) {
    // Legacy single-station save
    stationList = [{
      id: '9999',
      lat: parseFloat(state.obsLat) || 0,
      lon: parseFloat(state.obsLon) || 0,
      alt: parseFloat(state.obsAlt) || 0
    }];
    defaultStationId = '9999';
  }
  applyDefaultStationToObserver();
  if (typeof renderStationList === 'function') renderStationList();

  const setChk = (id, v) => {
    const el = document.getElementById(id);
    if (el && typeof v === 'boolean') el.checked = v;
  };
  setChk('tog-sat-labels', state.togSatLabels);
  setChk('tog-const', state.togConst);
  setChk('tog-bodies', state.togBodies);
  setChk('tog-alt', state.togAlt);

  if (state.theme === 'light' || state.theme === 'dark') {
    document.documentElement.setAttribute('data-theme', state.theme);
  }
  if (typeof showSatLabels !== 'undefined') {
    showSatLabels = !!document.getElementById('tog-sat-labels')?.checked;
    showConst = !!document.getElementById('tog-const')?.checked;
    showBodies = !!document.getElementById('tog-bodies')?.checked;
    showAlt = !!document.getElementById('tog-alt')?.checked;
    satSize = parseFloat(document.getElementById('sat-size-slider')?.value) || 0.35;
    magLimit = parseFloat(document.getElementById('mag-slider')?.value) || 4;
  }
  return true;
}

let _saveTimer = null;
function scheduleSaveAppState(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveAppState, 300);
}

(function initTheme(){
  function systemTheme(){
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  // Prefer saved state theme, then iod-theme key, then OS
  let mode = null;
  try {
    const st = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (st && (st.theme === 'light' || st.theme === 'dark')) mode = st.theme;
  } catch (e) {}
  if (!mode) mode = localStorage.getItem('iod-theme') || getCookie('iod_theme');
  if (mode !== 'light' && mode !== 'dark') mode = systemTheme();
  document.documentElement.setAttribute('data-theme', mode);
  const btn = document.getElementById('btn-theme');
  if (btn) {
    btn.textContent = mode === 'dark' ? '☀' : '☾';
    btn.title = mode === 'dark' ? 'Switch to day theme' : 'Switch to night theme';
    btn.addEventListener('click', () => {
      const next = getThemeMode() === 'dark' ? 'light' : 'dark';
      localStorage.setItem('iod-theme', next);
      applyTheme(next);
      scheduleSaveAppState();
    });
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('iod-theme') && !getCookie('iod_theme')) applyTheme(e.matches ? 'dark' : 'light');
  });
})();

/* ============================================================
   Math
   ============================================================ */
const RE=6371.0, MU=398600.4418, DEG=Math.PI/180, RAD=180/Math.PI;
const WGS84_A = 6378.137, WGS84_F = 1 / 298.257223563, WGS84_E2 = WGS84_F * (2 - WGS84_F);

function dateToJD(d){return d.getTime()/86400000+2440587.5}
/** Greenwich Mean Sidereal Time [deg] — Vallado / consistent with SGP4 gstime */
function gmst(jd){
  if (typeof SGP4 !== 'undefined' && SGP4.gstime) {
    return ((SGP4.gstime(jd) * RAD) % 360 + 360) % 360;
  }
  const T=(jd-2451545.0)/36525;
  let st=280.46061837+360.98564736629*(jd-2451545.0)+0.000387933*T*T-T*T*T/38710000;
  return ((st%360)+360)%360;
}
function geodeticToECEF(lat,lon,alt_m){
  const a=WGS84_A,e2=WGS84_E2;
  const latR=lat*DEG,lonR=lon*DEG,sinLat=Math.sin(latR),cosLat=Math.cos(latR);
  const N=a/Math.sqrt(1-e2*sinLat*sinLat),h=alt_m/1000;
  return {x:(N+h)*cosLat*Math.cos(lonR),y:(N+h)*cosLat*Math.sin(lonR),z:(N*(1-e2)+h)*sinLat};
}
/** RA/Dec (deg, equatorial) → unit vector in ECEF using GMST at observation epoch */
function raDecToECEFUnit(ra,dec,gmstDeg){
  const raR=ra*DEG,decR=dec*DEG,cosDec=Math.cos(decR);
  // Equatorial inertial (mean equator / equinox of date approximation)
  const xi=cosDec*Math.cos(raR),yi=cosDec*Math.sin(raR),zi=Math.sin(decR);
  const g=gmstDeg*DEG,cosG=Math.cos(g),sinG=Math.sin(g);
  // Rotate by GMST about Z → ECEF
  return {x:xi*cosG+yi*sinG,y:-xi*sinG+yi*cosG,z:zi};
}
/** Ray from observer through unit dir → first intersection with sphere radius R (km) */
function raySphereIntersect(obs,dir,R){
  // Normalize direction for stable range
  const dn = vNorm(dir);
  if (dn < 1e-14) return null;
  const ux = dir.x / dn, uy = dir.y / dn, uz = dir.z / dn;
  const b = 2 * (obs.x * ux + obs.y * uy + obs.z * uz);
  const c = obs.x * obs.x + obs.y * obs.y + obs.z * obs.z - R * R;
  const disc = b * b - 4 * c;
  if (disc < 0) return null;
  const s = Math.sqrt(disc);
  const t1 = (-b - s) / 2, t2 = (-b + s) / 2;
  // Closest positive intersection (satellite along line of sight)
  let t = null;
  if (t1 > 0.05) t = t1;
  else if (t2 > 0.05) t = t2;
  if (t === null) return null;
  return { x: obs.x + t * ux, y: obs.y + t * uy, z: obs.z + t * uz };
}
/** ECEF → geodetic lat/lon (WGS84) and geocentric radius */
function ecefToLatLon(p){
  const x = p.x, y = p.y, z = p.z;
  const lon = Math.atan2(y, x) * RAD;
  const pxy = Math.sqrt(x * x + y * y);
  const r = Math.sqrt(x * x + y * y + z * z);
  // Bowring iterative geodetic latitude
  let lat = Math.atan2(z, pxy * (1 - WGS84_E2));
  for (let i = 0; i < 6; i++) {
    const sinLat = Math.sin(lat);
    const N = WGS84_A / Math.sqrt(1 - WGS84_E2 * sinLat * sinLat);
    lat = Math.atan2(z + WGS84_E2 * N * sinLat, pxy);
  }
  return { lat: lat * RAD, lon, r };
}
/** Spherical linear interpolation of unit vectors (for RA/Dec between obs) */
function slerpUnit(a, b, frac){
  let d = vDot(a, b);
  d = Math.max(-1, Math.min(1, d));
  const th = Math.acos(d);
  if (th < 1e-8) return vUnit(vAdd(a, vScale(vSub(b, a), frac)));
  const s = Math.sin(th);
  return vUnit(vAdd(vScale(a, Math.sin((1 - frac) * th) / s), vScale(b, Math.sin(frac * th) / s)));
}
/** Interpolate RA/Dec (deg) on the sphere */
function interpRaDec(ra1, dec1, ra2, dec2, frac){
  const u1 = {
    x: Math.cos(dec1 * DEG) * Math.cos(ra1 * DEG),
    y: Math.cos(dec1 * DEG) * Math.sin(ra1 * DEG),
    z: Math.sin(dec1 * DEG)
  };
  const u2 = {
    x: Math.cos(dec2 * DEG) * Math.cos(ra2 * DEG),
    y: Math.cos(dec2 * DEG) * Math.sin(ra2 * DEG),
    z: Math.sin(dec2 * DEG)
  };
  const u = slerpUnit(u1, u2, frac);
  const dec = Math.asin(Math.max(-1, Math.min(1, u.z))) * RAD;
  let ra = Math.atan2(u.y, u.x) * RAD;
  if (ra < 0) ra += 360;
  return { ra, dec };
}
function vNorm(v){return Math.sqrt(v.x*v.x+v.y*v.y+v.z*v.z)}
function vDot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z}
function vCross(a,b){return {x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}}
function vScale(v,s){return {x:v.x*s,y:v.y*s,z:v.z*s}}
function vAdd(a,b){return {x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}}
function vSub(a,b){return {x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}}
function vUnit(v){const n=vNorm(v);return n>1e-12?vScale(v,1/n):v}

function raDecToAzEl(raDeg,decDeg,latDeg,lstDeg){
  const ha=(lstDeg-raDeg+360)%360;
  const haR=ha*DEG,decR=decDeg*DEG,latR=latDeg*DEG;
  const sinEl=Math.sin(decR)*Math.sin(latR)+Math.cos(decR)*Math.cos(latR)*Math.cos(haR);
  const el=Math.asin(Math.max(-1,Math.min(1,sinEl)))*RAD;
  const cosEl=Math.cos(el*DEG);
  let az=0;
  if(Math.abs(cosEl)>1e-6){
    const cosAz=(Math.sin(decR)-Math.sin(latR)*sinEl)/(Math.cos(latR)*cosEl);
    const sinAz=-Math.sin(haR)*Math.cos(decR)/cosEl;
    az=Math.atan2(sinAz,cosAz)*RAD; if(az<0) az+=360;
  }
  return {az,el};
}
function sunRaDec(jd){
  const n=jd-2451545.0;
  const L=(280.460+0.9856474*n)%360;
  const g=((357.528+0.9856003*n)%360)*DEG;
  const lambda=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))%360;
  const eps=23.439*DEG;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lambda*DEG),Math.cos(lambda*DEG))*RAD;
  const dec=Math.asin(Math.sin(eps)*Math.sin(lambda*DEG))*RAD;
  return {ra:(ra+360)%360,dec};
}
function moonRaDec(jd){
  const n=jd-2451545.0;
  const L=(218.316+13.176396*n)%360;
  const g=((134.963+13.064993*n)%360)*DEG;
  const F=((93.272+13.229350*n)%360)*DEG;
  const lambda=L+6.289*Math.sin(g);
  const beta=5.128*Math.sin(F);
  const eps=23.439*DEG;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lambda*DEG)-Math.sin(eps)*Math.tan(beta*DEG),Math.cos(lambda*DEG))*RAD;
  const dec=Math.asin(Math.sin(eps)*Math.sin(lambda*DEG)*Math.cos(beta*DEG)+Math.cos(eps)*Math.sin(beta*DEG))*RAD;
  return {ra:(ra+360)%360,dec};
}
function gibbs(r1,r2,r3){
  const r1n=vNorm(r1),r2n=vNorm(r2),r3n=vNorm(r3);
  const Z12=vCross(r1,r2),Z23=vCross(r2,r3),Z31=vCross(r3,r1);
  const N=vAdd(vAdd(vScale(Z23,r1n),vScale(Z31,r2n)),vScale(Z12,r3n));
  const D=vAdd(vAdd(Z12,Z23),Z31);
  const S=vAdd(vAdd(vScale(r1,r2n-r3n),vScale(r2,r3n-r1n)),vScale(r3,r1n-r2n));
  const Nn=vNorm(N),Dn=vNorm(D); if(Nn<1e-6||Dn<1e-6) return null;
  const B=vCross(D,r2),Lg=Math.sqrt(MU/(Nn*Dn));
  return vAdd(vScale(B,Lg/r2n),vScale(S,Lg));
}
function rv2coe(r,v){
  const rn=vNorm(r),vn=vNorm(v),h=vCross(r,v),hn=vNorm(h);
  const eVec=vScale(vSub(vScale(vCross(v,h),1/MU),vScale(r,1/rn)),1);
  const e=vNorm(eVec),energy=vn*vn/2-MU/rn;
  const a=Math.abs(energy)>1e-8?-MU/(2*energy):1e9;
  const i=Math.acos(Math.max(-1,Math.min(1,h.z/hn)))*RAD;
  return {a,e,i,period:2*Math.PI*Math.sqrt(a*a*a/MU)/60};
}

function parseStarCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line || line.toLowerCase().startsWith('hip')) continue;
    const parts = line.split(',');
    if (parts.length < 4) continue;
    const hip = parts[0].trim();
    const ra  = parseFloat(parts[1]);
    const dec = parseFloat(parts[2]);
    const mag = parseFloat(parts[3]);
    if (isNaN(ra) || isNaN(dec) || isNaN(mag)) continue;
    out.push({hip, ra, dec, mag});
  }
  out.sort((a,b) => a.mag - b.mag);
  return out;
}

  const stars = parseStarCSV(EMBEDDED_CSV);
  applyStarCatalog(stars, 'embedded');

  // If served over http and a larger CSV is present, use that instead
  const candidates = ['hip_stars.csv', './hip_stars.csv'];
  for (const url of candidates) {
    try {
      const res = await fetch(url, {cache:'no-store'});
      if (res.ok) {
        const text = await res.text();
        const external = parseStarCSV(text);
        if (external.length > stars.length) {
          applyStarCatalog(external, url);
          return;
        }
      }
    } catch(e) {}
  }
}

    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const stars = parseStarCSV(String(reader.result || ''));
      if (stars.length === 0) {
        document.getElementById('star-status').textContent = 'Stars: invalid CSV';
        document.getElementById('star-status').style.color = 'var(--orange)';
        return;
      }
      applyStarCatalog(stars, file.name);
    };
    reader.readAsText(file);
  });
}

/* ============================================================
   IOD Parser + estimators
   ============================================================ */
/** Parse classic 2-line TLE (optional name line above). Returns element set or null. */
/* ---- SGP4 (NORAD / Spacetrack Report #3 style) for operational TLE use ---- */
const SGP4 = (function(){
  const twopi = 2 * Math.PI;
  const deg2rad = Math.PI / 180;
  const xpdotp = 1440 / (2 * Math.PI); // 229.1831180523293
  const mu = 398600.5; // km^3/s^2 WGS72
  const radiusearthkm = 6378.135;
  const xke = 60.0 / Math.sqrt(radiusearthkm * radiusearthkm * radiusearthkm / mu);
  const tumin = 1.0 / xke;
  const j2 = 0.00108262998905;
  const j3 = -0.00000253215306;
  const j4 = -0.00000161098761;
  const j3oj2 = j3 / j2;

  function gstime(jdut1){
    const tut1 = (jdut1 - 2451545.0) / 36525.0;
    let temp = -6.2e-6 * tut1 * tut1 * tut1 + 0.093104 * tut1 * tut1 +
      (876600.0 * 3600 + 8640184.812866) * tut1 + 67310.54841;
    temp = ((temp * deg2rad / 240.0) % twopi);

  function sgp4init(satrec){

    return true;
  }

  function sgp4(satrec, tsince){
    // tsince in minutes from epoch
    const x2o3 = 2.0 / 3.0;
    satrec.t = tsince;
    satrec.error = 0;

    let xmdf = satrec.mo + satrec.mdot * satrec.t;
    let argpdf = satrec.argpo + satrec.argpdot * satrec.t;
    let nodedf = satrec.nodeo + satrec.nodedot * satrec.t;
    let t2 = satrec.t * satrec.t;
    let nodem = nodedf + satrec.nodecf * t2;
    let tempa = 1.0 - satrec.cc1 * satrec.t;
    let tempe = satrec.bstar * satrec.cc4 * satrec.t;
    let templ = satrec.t2cof * t2;

    if (satrec.method !== 'd') {
      const delomg = satrec.omgcof * satrec.t;
      const delmtemp = 1.0 + satrec.eta * Math.cos(xmdf);
      const delm = satrec.xmcof * (delmtemp * delmtemp * delmtemp - satrec.delmo);
      const temp = delomg + delm;
      xmdf = xmdf + temp;
      argpdf = argpdf - temp;

    const rl = am * (1.0 - ecose);

    const rvdotl = Math.sqrt(pl) / rl;
    const betal = Math.sqrt(1.0 - el2);
    temp = esine / (1.0 + betal);
    const sinu = am / rl * (sineo1 - aynl - axnl * temp);
    const cosu = am / rl * (coseo1 - axnl + aynl * temp);

    const sin2u = (cosu + cosu) * sinu;

    temp = 1.0 / pl;
    const temp1 = 0.5 * j2 * temp;
    const temp2 = temp1 * temp;

    const mrt = rl * (1.0 - 1.5 * temp2 * betal * satrec.con41) + 0.5 * temp1 * satrec.x1mth2 * cos2u;
    su = su - 0.25 * temp2 * satrec.x7thm1 * sin2u;

    const xinc = inclm + 1.5 * temp2 * cosim * sinim * cos2u;

    const rvdot = rvdotl + nm * temp1 * (satrec.x1mth2 * cos2u + 1.5 * satrec.con41) / xke;

    const sinsu = Math.sin(su);

  function twoline2satrec(line1, line2){

    const frac = epochdays - dayInt;
    satrec.epochMs = Date.UTC(year, 0, 1) + (dayInt - 1) * 86400000 + frac * 86400000;
    satrec.jdsatepoch = satrec.epochMs / 86400000 + 2440587.5;

    satrec.ndot = parseFloatTLE(L1.substring(33, 43)) / (xpdotp * 1440.0);
    satrec.nddot = parseFloatTLE(L1.substring(44, 52));
    satrec.bstar = parseFloatTLE(L1.substring(53, 61));

    satrec.nodeo = parseFloat(L2.substring(17, 25)) * deg2rad;
    satrec.ecco = parseFloat('0.' + L2.substring(26, 33).trim().replace(/[^\d]/g, ''));

    if (!satrec) return null;

    const rteme = sgp4(satrec, tsince);
    if (!rteme) return null;

    const jd = timeMs / 86400000 + 2440587.5;

    const ct = Math.cos(theta), st = Math.sin(theta);

    return { x, y, z };

  return { twoline2satrec, propagate, gstime };
})();

function parseTLE(line1, line2, name){
  if (!line1 || !line2) return null;
  const L1 = line1.replace(/\r/g, '').padEnd(69, ' ');
  const L2 = line2.replace(/\r/g, '').padEnd(69, ' ');
  if (L1.charAt(0) !== '1' || L2.charAt(0) !== '2') return null;
  try {
    const satrec = SGP4.twoline2satrec(L1, L2);
    if (!satrec) return null;
    const norad = satrec.satnum;
    const nRev = satrec.no * (1440 / (2 * Math.PI)); // rev/day
    const periodMin = 1440 / nRev;
    const a = Math.pow(398600.5 / Math.pow(satrec.no / 60, 2), 1 / 3); // km from n rad/s
    return {
      norad, name: (name || '').trim() || null,
      epochMs: satrec.epochMs,
      incl: satrec.inclo * RAD,
      raan: satrec.nodeo * RAD,
      ecc: satrec.ecco,
      argp: satrec.argpo * RAD,
      M0: satrec.mo * RAD,
      n: satrec.no / 60, // rad/s
      a, periodMin, nRev,
      satrec // SGP4 state
    };
  } catch (e) {
    console.warn('TLE parse failed', e);
    return null;
  }
}

/** SGP4 propagation → ECEF km at timeMs */
function propagateTLE(tle, timeMs){
  if (!tle || !isFinite(timeMs)) return null;
  let ecef;
  if (tle.satrec) {
    ecef = SGP4.propagate(tle.satrec, timeMs);
  } else {
    return null;
  }
  if (!ecef) return null;
  const ll = ecefToLatLon(ecef);
  return { x: ecef.x, y: ecef.y, z: ecef.z, lat: ll.lat, lon: ll.lon };
}

/** Solid TLE track: [firstIOD−5min, lastIOD+5min], else one period about timeMs */
function sampleTLEOrbit(tle, steps, tStartMs, tEndMs){
  steps = steps || 180;
  let t0, t1;
  if (tStartMs != null && tEndMs != null && isFinite(tStartMs) && isFinite(tEndMs) && tEndMs > tStartMs) {
    t0 = tStartMs;
    t1 = tEndMs;
  } else {
    const periodMs = tle.periodMin * 60 * 1000;
    const c = (tStartMs != null && isFinite(tStartMs)) ? tStartMs : tle.epochMs;
    t0 = c;
    t1 = c + periodMs;
  }
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = t0 + (i / steps) * (t1 - t0);
    const p = propagateTLE(tle, t);
    if (p) pts.push(p);
  }
  return pts;
}

/** IOD observation window ±5 minutes for solid TLE track */
function getIODTrackWindow(){
  if (!observations || !observations.length) return null;
  const ts = observations.map(o => o.timeMs).filter(isFinite);
  if (!ts.length) return null;
  let t0 = Math.min(...ts);
  let t1 = Math.max(...ts);
  if (t1 <= t0) t1 = t0 + 5 * 60 * 1000;
  return { start: t0 - 5 * 60 * 1000, end: t1 + 5 * 60 * 1000 };
}

/** Rebuild TLE solid track for observation window (or one period if no IOD) */
function refreshTLEOrbit(sat, timeMs){
  if (!sat || !sat.tle) return;
  const win = getIODTrackWindow();
  let samples;
  if (win) {
    samples = sampleTLEOrbit(sat.tle, 200, win.start, win.end);
  } else {
    samples = sampleTLEOrbit(sat.tle, 120, timeMs != null ? timeMs : sat.tle.epochMs, null);
  }
  sat.orbitPoints = samples.map(p => ({ x: p.x, y: p.y, z: p.z }));
  sat.groundTrack = samples.map(p => ({ lat: p.lat, lon: p.lon }));
  sat.groundTrack.color = sat.color;
  sat.iodTrack = {
    latlngs: samples.map(p => [p.lat, p.lon]),
    color: sat.color
  };
}

/** ECEF → topocentric Az/El from observer */
function ecefToAzEl(satECEF, obs){
  const obsECEF = geodeticToECEF(obs.lat, obs.lon, obs.alt);
  const dx = satECEF.x - obsECEF.x, dy = satECEF.y - obsECEF.y, dz = satECEF.z - obsECEF.z;
  const latR = obs.lat * DEG, lonR = obs.lon * DEG;
  const sinLat = Math.sin(latR), cosLat = Math.cos(latR);
  const sinLon = Math.sin(lonR), cosLon = Math.cos(lonR);
  // ENU
  const east = -sinLon * dx + cosLon * dy;
  const north = -sinLat * cosLon * dx - sinLat * sinLon * dy + cosLat * dz;
  const up = cosLat * cosLon * dx + cosLat * sinLon * dy + sinLat * dz;
  const az = (Math.atan2(east, north) * RAD + 360) % 360;
  const el = Math.atan2(up, Math.sqrt(east * east + north * north)) * RAD;
  return { az, el };
}

function parseIOD(line){
  // Keep leading spaces for fixed-column IOD; only strip CR and trailing space
  line = String(line || '').replace(/\r/g, '').replace(/\s+$/, '');
  if (line.length < 45) return null;
  const trimmed = line.trim();
  // Skip TLE lines
  if (/^1\s/.test(trimmed) || /^2\s/.test(trimmed)) return null;

  // NORAD / object id = first column only
  const firstCol = (trimmed.split(/\s+/)[0] || '').trim();
  const obj = (firstCol.match(/\d+/) || [firstCol])[0];
  if (!obj) return null;

  // Date/time: prefer fixed columns 24–40 (0-based 23–40), else regex fallback
  let ymd = line.substring(23, 31);
  let hms = line.substring(31, 40);
  if (!/^\d{8}$/.test(ymd)) {
    const m = trimmed.match(/(20\d{6}|19\d{6})(\d{6,9})/);
    if (!m) return null;
    ymd = m[1];
    hms = m[2];
  }
  const year = +ymd.slice(0, 4), month = +ymd.slice(4, 6), day = +ymd.slice(6, 8);
  let hour = 0, min = 0, sec = 0;
  if (hms.trim()) {
    hour = +(hms.slice(0, 2) || 0);
    min = +(hms.slice(2, 4) || 0);
    if (hms.length >= 6) {
      sec = +(hms.slice(4, 6) || 0);
      if (hms.length > 6) sec += parseFloat('0.' + hms.slice(6));
    }
  }
  const utc = new Date(Date.UTC(year, month - 1, day, hour, min, Math.floor(sec), Math.round((sec % 1) * 1000)));
  if (isNaN(utc.getTime())) return null;

  // Angle format code (column 45 → index 44); default to 2 if missing
  let angFmt = +(line[44] || trimmed[44] || 2);
  if (![1, 2, 3, 7].includes(angFmt)) angFmt = 2;

  let raaz = line.substring(47, 54).trim();
  let sign = line[54] || '+';
  let decel = line.substring(55, 61).trim();
  // Fallback: find "DDDDDDD±DDDDDD" pattern near end
  if (!raaz || raaz.length < 4) {
    const am = trimmed.match(/(\d{6,7})\s*([+-])\s*(\d{5,7})/);
    if (am) { raaz = am[1]; sign = am[2]; decel = am[3]; }
  }

  let ra = null, dec = null;
  if (angFmt === 1 || angFmt === 7) {
    const hh = +raaz.slice(0, 2), mm = +raaz.slice(2, 4), ss = +raaz.slice(4, 6);
    const s = raaz.length > 6 ? +raaz[6] / 10 : 0;
    ra = (hh + mm / 60 + (ss + s) / 3600) * 15;
  } else if (angFmt === 2 || angFmt === 3) {
    const hh = +raaz.slice(0, 2), mm = +raaz.slice(2, 4);
    const mmm = raaz.length > 4 ? +raaz.slice(4) : 0;
    ra = (hh + (mm + mmm / 1000) / 60) * 15;
  }
  if (angFmt === 1) {
    const dd = +decel.slice(0, 2), mm = +decel.slice(2, 4), ss = +decel.slice(4, 6);
    dec = (dd + mm / 60 + ss / 3600) * (sign === '-' ? -1 : 1);
  } else if (angFmt === 2) {
    const dd = +decel.slice(0, 2), mm = +decel.slice(2, 4);
    const mmf = decel.length > 4 ? +decel.slice(4) : 0;
    dec = (dd + (mm + mmf / 100) / 60) * (sign === '-' ? -1 : 1);
  } else if (angFmt === 3 || angFmt === 7) {
    const dd = +decel.slice(0, 2);
    const dddd = decel.length > 2 ? +decel.slice(2) : 0;
    dec = (dd + dddd / Math.pow(10, Math.max(decel.length - 2, 1))) * (sign === '-' ? -1 : 1);
  }
  if (ra === null || !isFinite(ra) || dec === null || !isFinite(dec)) return null;
  return { object: String(obj), utc, timeMs: utc.getTime(), ra, dec };
}

/** Score circular altitude h (km) against successive IOD pairs (angular rate match) */
function scoreAltitude(h, obsList, obsECEF){
  const R = RE + h;
  let total = 0, valid = 0;
  for (let i = 0; i < obsList.length - 1; i++) {
    const o1 = obsList[i], o2 = obsList[i + 1];
    const dt = (o2.timeMs - o1.timeMs) / 1000;
    if (dt < 0.5 || dt > 7200) continue;
    const d1 = raDecToECEFUnit(o1.ra, o1.dec, gmst(dateToJD(o1.utc)));
    const d2 = raDecToECEFUnit(o2.ra, o2.dec, gmst(dateToJD(o2.utc)));
    const p1 = raySphereIntersect(obsECEF, d1, R);
    const p2 = raySphereIntersect(obsECEF, d2, R);
    if (!p1 || !p2) continue;
    const cosTh = Math.max(-1, Math.min(1, vDot(p1, p2) / (vNorm(p1) * vNorm(p2))));
    const theta = Math.acos(cosTh);
    const n = Math.sqrt(MU / (R * R * R));
    const expected = n * dt;
    // Prefer relative angular error; also soft-penalize range mismatch vs circular speed
    total += Math.abs(theta - expected) / Math.max(expected, 1e-4);
    valid++;
  }
  if (valid === 0) return Infinity;
  return total / valid;
}
function estimateCircularAltitude(obsList, observer){
  if (obsList.length < 2) return null;
  const obsECEF = geodeticToECEF(observer.lat, observer.lon, observer.alt);
  // Coarse grid then refine around best
  let bestH = null, bestScore = Infinity;
  const cands = [];
  for (let h = 150; h <= 1500; h += 10) cands.push(h);
  for (let h = 1600; h <= 4000; h += 50) cands.push(h);
  cands.push(35786);
  for (const h of cands) {
    const avg = scoreAltitude(h, obsList, obsECEF);
    if (avg < bestScore) { bestScore = avg; bestH = h; }
  }
  if (bestH == null || bestScore > 0.65) return null;
  // Local refinement ±15 km at 1 km steps
  let refineBest = bestH, refineScore = bestScore;
  for (let h = bestH - 15; h <= bestH + 15; h += 1) {
    if (h < 120) continue;
    const avg = scoreAltitude(h, obsList, obsECEF);
    if (avg < refineScore) { refineScore = avg; refineBest = h; }
  }
  return { altitude: refineBest, score: refineScore };
}
/**
 * Orbital elements from optical IOD only.
 * Positions use the optical altitude estimate (never TLE height), so
 * inclination stays fixed when a matching TLE is toggled.
 */
function estimateElements(obsList, altKm, observer){
  if (obsList.length < 2) return null;
  const positions = [];
  for (const o of obsList) {
    const p = computePosition(o, altKm, observer);
    if (p) positions.push({ ...p, timeMs: o.timeMs });
  }
  if (positions.length < 2) return null;

  // Inclination from average orbit-plane normal of consecutive geocentric positions
  let nx = 0, ny = 0, nz = 0, nCount = 0;
  let ref = null;
  for (let i = 0; i < positions.length - 1; i++) {
    const c = vCross(positions[i], positions[i + 1]);
    const cn = vNorm(c);
    if (cn < 1e-12) continue;
    let ux = c.x / cn, uy = c.y / cn, uz = c.z / cn;
    if (ref == null) ref = { x: ux, y: uy, z: uz };
    else if (ux * ref.x + uy * ref.y + uz * ref.z < 0) {
      ux = -ux; uy = -uy; uz = -uz;
    }
    nx += ux; ny += uy; nz += uz;
    nCount++;
  }
  if (nCount === 0) {
    const c = vCross(positions[0], positions[positions.length - 1]);
    nx = c.x; ny = c.y; nz = c.z;
    nCount = 1;
  }
  const nPlane = vUnit({ x: nx / nCount, y: ny / nCount, z: nz / nCount });
  // i = angle between plane normal and Earth axis (Z)
  const incl = Math.acos(Math.max(-1, Math.min(1, Math.abs(nPlane.z)))) * RAD;

  let ecc = null, sma = altKm + RE, periodMin = null;
  if (positions.length >= 3) {
    const i1 = 0;
    const i2 = Math.floor(positions.length / 2);
    const i3 = positions.length - 1;
    const v2 = gibbs(positions[i1], positions[i2], positions[i3]);
    if (v2) {
      const coe = rv2coe(positions[i2], v2);
      ecc = coe.e; sma = coe.a; periodMin = coe.period;
    }
  }
  if (periodMin == null && positions.length >= 2) {
    const p1 = positions[0], p2 = positions[positions.length - 1];
    const dt = (p2.timeMs - p1.timeMs) / 1000;
    if (dt > 1) {
      const cosTh = Math.max(-1, Math.min(1, vDot(p1, p2) / (vNorm(p1) * vNorm(p2))));
      const theta = Math.acos(cosTh);
      if (theta > 1e-4) {
        const nRate = theta / dt;
        const a = Math.pow(MU / (nRate * nRate), 1 / 3);
        periodMin = 2 * Math.PI * Math.sqrt(a * a * a / MU) / 60;
        sma = a;
      }
    }
  }
  return {
    inclination: incl,
    eccentricity: ecc,
    sma,
    altitude: sma - RE,
    periodMin,
    planeNormal: nPlane
  };
}
function generateOrbitPoints(p1,p2,R,num=180){
  const n=vUnit(vCross(p1,p2));
  const xAxis=vUnit(p1);
  const yAxis=vUnit(vCross(n,xAxis));
  const pts=[];
  for(let i=0;i<=num;i++){
    const ang=(i/num)*2*Math.PI;
    pts.push(vAdd(vScale(xAxis,R*Math.cos(ang)),vScale(yAxis,R*Math.sin(ang))));
  }
  return pts;
}

/** Elliptical orbit in the plane of p1–p2 (IOD plane), with semi-major a [km] and eccentricity e */
function generateEllipticalOrbitPoints(p1, p2, a, e, num){
  num = num || 200;
  e = Math.max(0, Math.min(0.99, e || 0));
  if (!(a > RE) || e < 1e-6) {
    return generateOrbitPoints(p1, p2, a * (1 - e * e) / Math.max(1e-6, 1 - e), num); // near-circular fallback
  }
  const n = vUnit(vCross(p1, p2));
  const xAxis = vUnit(p1); // periapsis reference in plane (approx)
  const yAxis = vUnit(vCross(n, xAxis));
  const pts = [];
  for (let i = 0; i <= num; i++) {
    const M = (i / num) * 2 * Math.PI;
    let E = M;
    for (let k = 0; k < 12; k++) {
      const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      E -= dE;
      if (Math.abs(dE) < 1e-12) break;
    }
    const cosE = Math.cos(E), sinE = Math.sin(E);
    const r = a * (1 - e * cosE);
    const cosNu = (cosE - e) / (1 - e * cosE);
    const sinNu = (Math.sqrt(Math.max(0, 1 - e * e)) * sinE) / (1 - e * cosE);
    pts.push(vAdd(vScale(xAxis, r * cosNu), vScale(yAxis, r * sinNu)));
  }
  return pts;
}

function parseBulkTLE(text){
  const map = {};
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length);
  let pendingName = null;
  for (const line of lines) {
    if (line.startsWith('1 ') && line.length >= 7) {
      const norad = line.substring(2, 7).trim().padStart(5, '0');
      if (pendingName) map[norad] = pendingName;
      else map[norad] = norad;
      pendingName = null;
    } else if (line.startsWith('2 ')) {
      // skip line 2
    } else {
      pendingName = line;
    }
  }
  return map;
}

/** Slant range [km] between observer and satellite ECEF */
function slantRangeKm(satECEF, obsObj){
  const o = obsObj || observer;
  const obsECEF = geodeticToECEF(o.lat, o.lon, o.alt);
  const dx = satECEF.x - obsECEF.x, dy = satECEF.y - obsECEF.y, dz = satECEF.z - obsECEF.z;
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

/**
 * Position from optical LOS + slant range ρ [km]:
 * r = r_obs + ρ * û_IOD
 */
function computePositionFromSlantRange(obs, rhoKm, obsObj){
  if (!(rhoKm > 1)) return null;
  const o = obsObj || observer;
  const jd = dateToJD(obs.utc || new Date(obs.timeMs));
  const gst = gmst(jd);
  const dir = raDecToECEFUnit(obs.ra, obs.dec, gst);
  const dn = vNorm(dir);
  if (dn < 1e-14) return null;
  const ux = dir.x / dn, uy = dir.y / dn, uz = dir.z / dn;
  const obsECEF = geodeticToECEF(o.lat, o.lon, o.alt);
  const pos = {
    x: obsECEF.x + rhoKm * ux,
    y: obsECEF.y + rhoKm * uy,
    z: obsECEF.z + rhoKm * uz
  };
  const ll = ecefToLatLon(pos);
  const h = Math.sqrt(pos.x * pos.x + pos.y * pos.y + pos.z * pos.z) - RE;
  return {
    ...pos, lat: ll.lat, lon: ll.lon,
    ra: obs.ra, dec: obs.dec, timeMs: obs.timeMs,
    slantRange: rhoKm, altitude: h
  };
}

/**
 * Geocentric position from optical observation ∩ altitude sphere
 * (IOD-only when no TLE slant range).
 */
function computePosition(obs, altKm, obsObj){
  const o = obsObj || observer;
  const jd = dateToJD(obs.utc || new Date(obs.timeMs));
  const gst = gmst(jd);
  const dir = raDecToECEFUnit(obs.ra, obs.dec, gst);
  const obsECEF = geodeticToECEF(o.lat, o.lon, o.alt);
  const pos = raySphereIntersect(obsECEF, dir, RE + altKm);
  if (!pos) return null;
  const ll = ecefToLatLon(pos);
  const rho = slantRangeKm(pos, o);
  return {
    ...pos, lat: ll.lat, lon: ll.lon,
    ra: obs.ra, dec: obs.dec, timeMs: obs.timeMs,
    slantRange: rho, altitude: altKm
  };
}

function computePositionAtTime(obsList, t, altKm, obsObj){
  if (!obsList || !obsList.length) return null;
  if (obsList.length === 1 || t <= obsList[0].timeMs) {
    return computePosition(obsList[0], altKm, obsObj);
  }
  if (t >= obsList[obsList.length - 1].timeMs) {
    return computePosition(obsList[obsList.length - 1], altKm, obsObj);
  }
  let i = 0;
  while (i < obsList.length - 1 && obsList[i + 1].timeMs < t) i++;
  const a = obsList[i], b = obsList[i + 1];
  const dt = b.timeMs - a.timeMs;
  const frac = dt > 0 ? (t - a.timeMs) / dt : 0;
  const { ra, dec } = interpRaDec(a.ra, a.dec, b.ra, b.dec, frac);
  return computePosition({ ra, dec, utc: new Date(t), timeMs: t }, altKm, obsObj);
}

/** Interpolated RA/Dec observation at time t */
function interpObsAtTime(obsList, t){
  if (!obsList || !obsList.length) return null;
  if (obsList.length === 1 || t <= obsList[0].timeMs) return obsList[0];
  if (t >= obsList[obsList.length - 1].timeMs) return obsList[obsList.length - 1];
  let i = 0;
  while (i < obsList.length - 1 && obsList[i + 1].timeMs < t) i++;
  const a = obsList[i], b = obsList[i + 1];
  const dt = b.timeMs - a.timeMs;
  const frac = dt > 0 ? (t - a.timeMs) / dt : 0;
  const { ra, dec } = interpRaDec(a.ra, a.dec, b.ra, b.dec, frac);
  return { ra, dec, utc: new Date(t), timeMs: t, object: a.object };
}

function unwrapLongitudes(latlngs){
  if(!latlngs || latlngs.length < 2) return latlngs;
  const out = [[latlngs[0][0], latlngs[0][1]]];
  for(let i=1;i<latlngs.length;i++){
    let lat = latlngs[i][0];
    let lon = latlngs[i][1];
    const prevLon = out[out.length-1][1];
    while(lon - prevLon > 180) lon -= 360;
    while(lon - prevLon < -180) lon += 360;
    out.push([lat, lon]);
  }
  return out;
}

/* ============================================================
   3D Globe – equator horizontal, drag right = turn right
   ============================================================ */
let earth,satGroup,orbitGroup,obsMarker,equatorLine;
// scene, camera, renderer, earthGroup, globeStarMat declared with var above
let globeDistance=3.2;
let globeLon = 0;
let globeLat = 0;
const globeContainer=document.getElementById('globe-container');

function initGlobe(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(45,1,0.1,1000);
  camera.position.set(0,0,globeDistance);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  const gbg = getThemeMode() === 'light' ? 0xd1d5db : 0x000000;
  renderer.setClearColor(gbg, 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  globeContainer.appendChild(renderer.domElement);

  earthGroup = new THREE.Group();
  scene.add(earthGroup);

  const loader=new THREE.TextureLoader();
  earth=new THREE.Mesh(new THREE.SphereGeometry(1,64,64),new THREE.MeshPhongMaterial({
    map:loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
    specularMap:loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg'),
    shininess:12}));
  earthGroup.add(earth);

  // RED equator (horizontal when globeLat=0)
  const eqPts=[];
  for(let i=0;i<=128;i++){
    const a=i/128*Math.PI*2;
    eqPts.push(new THREE.Vector3(Math.cos(a)*1.002, 0, Math.sin(a)*1.002));
  }
  equatorLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(eqPts),
    new THREE.LineBasicMaterial({color:0xef4444, transparent:true, opacity:0.9}));
  earthGroup.add(equatorLine);

  earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.018,32,32),
    new THREE.MeshBasicMaterial({color:0x3388ff,transparent:true,opacity:0.13,side:THREE.BackSide})));

  scene.add(new THREE.AmbientLight(0x334455,0.95));
  const sun=new THREE.DirectionalLight(0xffffff,1.15); sun.position.set(5,3,5); scene.add(sun);

  const starPos=[]; for(let i=0;i<400;i++){
    const r=40+Math.random()*30,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    starPos.push(r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph));
  }
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));
  globeStarMat = new THREE.PointsMaterial({
    color: getThemeMode() === 'light' ? 0x6b7280 : 0xffffff,
    size: 0.08
  });
  scene.add(new THREE.Points(sg, globeStarMat));
  scene.background = new THREE.Color(getThemeMode() === 'light' ? 0xd1d5db : 0x000000);

  satGroup=new THREE.Group(); orbitGroup=new THREE.Group();
  earthGroup.add(satGroup); earthGroup.add(orbitGroup);
  obsMarker=new THREE.Mesh(new THREE.SphereGeometry(0.022,12,12),new THREE.MeshBasicMaterial({color:0xffaa00}));
  earthGroup.add(obsMarker);

  applyGlobeRotation();

  // Unified pointer + touch (mobile/tablet/PC)
  const gEl = renderer.domElement;
  gEl.style.touchAction = 'none';
  let dragging=false, px=0, py=0, pinchDist=0;

  function onGlobePointerDown(x, y){
    dragging = true; px = x; py = y;
  }
  function onGlobePointerMove(x, y){
    if (!dragging) return;
    const dx = x - px, dy = y - py;
    // Rotate around the focused station: left/right = spin, up/down = tilt
    const w = Math.max(gEl.clientWidth, 1);
    const h = Math.max(gEl.clientHeight, 1);
    const sensX = (2.0 * Math.PI) / w;   // horizontal: full turn across width
    const sensY = (1.2 * Math.PI) / h;   // vertical: easier tilt (was too stiff)
    globeLon -= dx * sensX;
    globeLat += dy * sensY;
    // Soft clamp — still allow near-polar views
    const lim = Math.PI / 2 - 0.05;
    if (globeLat > lim) globeLat = lim;
    if (globeLat < -lim) globeLat = -lim;
    applyGlobeRotation();
    px = x; py = y;
  }
  function onGlobePointerUp(){ dragging = false; pinchDist = 0; }

  gEl.addEventListener('pointerdown', e=>{
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    gEl.setPointerCapture(e.pointerId);
    onGlobePointerDown(e.clientX, e.clientY);
  });
  gEl.addEventListener('pointermove', e=>{
    if (!dragging || pinchDist) return;
    onGlobePointerMove(e.clientX, e.clientY);
  });
  gEl.addEventListener('pointerup', onGlobePointerUp);
  gEl.addEventListener('pointercancel', onGlobePointerUp);

  // Pinch-to-zoom on globe
  gEl.addEventListener('touchstart', e=>{
    if (e.touches.length === 2) {
      dragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.hypot(dx, dy);
    }
  }, {passive:true});
  gEl.addEventListener('touchmove', e=>{
    if (e.touches.length === 2 && pinchDist > 0) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      const scale = pinchDist / d;
      globeDistance = Math.max(1.5, Math.min(10, globeDistance * scale));
      camera.position.set(0,0,globeDistance);
      pinchDist = d;
    }
  }, {passive:false});
  gEl.addEventListener('touchend', e=>{
    if (e.touches.length < 2) pinchDist = 0;
  }, {passive:true});

  gEl.addEventListener('wheel', e=>{
    e.preventDefault();
    globeDistance = Math.max(1.5, Math.min(10, globeDistance + e.deltaY*0.002));
    camera.position.set(0,0,globeDistance);
  }, {passive:false});

  // Hover / click sat label when “Sat labels” is off
  const globeRay = new THREE.Raycaster();
  const globePtr = new THREE.Vector2();
  function pickGlobeSat(clientX, clientY){
    const rect = gEl.getBoundingClientRect();
    globePtr.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    globePtr.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    globeRay.setFromCamera(globePtr, camera);
    const hits = globeRay.intersectObjects(satGroup.children, true);
    for (const h of hits) {
      if (h.object.userData && h.object.userData.isSat) return h.object.userData.satId;
    }
    return null;
  }
  gEl.addEventListener('pointermove', e=>{
    if (showSatLabels || dragging || pinchDist) return;
    const id = pickGlobeSat(e.clientX, e.clientY);
    if (id !== hoveredSatId) {
      hoveredSatId = id;
      updateSimulation();
    }
  });
  gEl.addEventListener('pointerleave', ()=>{
    if (!showSatLabels && hoveredSatId) {
      hoveredSatId = null;
      updateSimulation();
    }
  });
  gEl.addEventListener('click', e=>{
    if (showSatLabels) return;
    const id = pickGlobeSat(e.clientX, e.clientY);
    hoveredSatId = id;
    updateSimulation();
  });

  new ResizeObserver(resizeGlobe).observe(globeContainer);
  resizeGlobe();
  (function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)})();
}

function applyGlobeRotation(){
  // YXZ: yaw then pitch — keeps equator roughly horizontal while dragging
  if (!earthGroup) return;
  earthGroup.rotation.order = 'YXZ';
  earthGroup.rotation.set(globeLat, globeLon, 0);
}

function resizeGlobe(){
  if (!globeContainer || !renderer || !camera) return;
  const parent = globeContainer.parentElement;
  let w = globeContainer.clientWidth || (parent && parent.clientWidth) || 0;
  let h = globeContainer.clientHeight || (parent && parent.clientHeight) || 0;
  if (w < 10) w = Math.max(window.innerWidth - 20, 300);
  if (h < 10) h = Math.max(Math.floor(window.innerHeight * 0.4), 220);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = '100%';
  renderer.domElement.style.height = '100%';
}
function clearOrbits(){while(orbitGroup.children.length)orbitGroup.remove(orbitGroup.children[0])}
function drawOrbit(points,color){
  const scale=1/RE;
  const pts=points.map(p=>new THREE.Vector3(p.x*scale, p.z*scale, -p.y*scale));
  orbitGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color,transparent:true,opacity:0.55})));
}
function updateGlobePositions(positions){
  while(satGroup.children.length)satGroup.remove(satGroup.children[0]);
  const scale=1/RE;
  const r=Math.max(0.006, 0.028*satSize);
  positions.forEach(p=>{
    if(!p) return;
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,12),new THREE.MeshBasicMaterial({color:p.color}));
    m.position.set(p.x*scale, p.z*scale, -p.y*scale);
    m.userData = { satId: p.id, isSat: true };
    satGroup.add(m);
    const labelText = satDisplayLabel(p.labelId || p.id);
    const show = showSatLabels || hoveredSatId === p.id;
    if (show) {
      const sp = createSatLabelSprite(labelText, p.color || '#e2e8f0', 'globe');
      sp.position.set(p.x*scale, p.z*scale + r*4 + 0.02, -p.y*scale);
      sp.userData = { satId: p.id, isSatLabel: true };
      satGroup.add(sp);
    }
  });
  const o=geodeticToECEF(observer.lat,observer.lon,observer.alt);
  obsMarker.position.set(o.x*scale, o.z*scale, -o.y*scale);
  obsMarker.scale.setScalar(Math.max(0.4, satSize));
}

/**
 * Center globe on observer station using the same Euler angles as drag.
 * Avoids quaternion→euler conversion which made tilt feel stuck / inverted.
 *
 * Markers use Three.js (ecef.x, ecef.z, -ecef.y). Camera is on +Z looking at origin.
 * For lat=0,lon=0 the point is (1,0,0); Ry(-π/2) brings it to (0,0,1).
 */
function focusGlobeOnData(){
  if (!earthGroup || !camera) return;

  const latR = observer.lat * DEG;
  const lonR = observer.lon * DEG;

  // Match drag convention (YXZ): pitch = lat, yaw = -lon - π/2
  globeLat = latR;
  globeLon = -lonR - Math.PI / 2;
  applyGlobeRotation();

  globeDistance = 2.4;
  camera.position.set(0, 0, globeDistance);
}

function fitMapToData(iodTracks){
  const pts=[[observer.lat,observer.lon]];
  (iodTracks||[]).forEach(tr=>{(tr.latlngs||[]).forEach(ll=>pts.push(ll))});
  if(pts.length<2){map.setView([observer.lat,observer.lon],6);return}
  map.fitBounds(L.latLngBounds(pts).pad(0.35),{maxZoom:8,animate:true});
}
function updateMap(positions,orbitTracks,iodTracks){
  markersLayer.clearLayers(); iodLayer.clearLayers(); orbitLayer.clearLayers();
  L.circleMarker([observer.lat,observer.lon],{
    radius:Math.max(3, 7*satSize),color:'#fbbf24',fillColor:'#fbbf24',fillOpacity:0.95
  }).addTo(markersLayer).bindPopup('Observer');

  (orbitTracks||[]).forEach(tr=>{
    if(tr.length < 3) return;
    const raw = tr.map(p => [p.lat, p.lon]);
    const unwrapped = unwrapLongitudes(raw);
    L.polyline(unwrapped, {
      color: tr.color, weight: 2.5, opacity: 0.55, dashArray: '6 5'
    }).addTo(orbitLayer);
  });

  (iodTracks||[]).forEach(tr=>{
    if(tr.latlngs && tr.latlngs.length >= 2){
      const unwrapped = unwrapLongitudes(tr.latlngs);
      L.polyline(unwrapped, {color:tr.color, weight:3.5, opacity:0.95}).addTo(iodLayer);
    }
    (tr.latlngs||[]).forEach(ll=>{
      L.circleMarker(ll,{radius:Math.max(2, 4.5*satSize),color:tr.color,fillColor:tr.color,fillOpacity:1}).addTo(iodLayer);
    });
  });

  positions.forEach(p=>{
    if(!p||p.lat==null) return;
    const label = satDisplayLabel(p.labelId || p.id);
    const mk = L.circleMarker([p.lat,p.lon],{
      radius:Math.max(3, 8*satSize),color:p.color,fillColor:'#fff',fillOpacity:0.9,weight:2
    }).addTo(markersLayer);
    // Always available on click (mobile) / hover (PC)
    mk.bindPopup('<span style="font-size:11px">'+label+'</span>');
    if (showSatLabels) {
      mk.bindTooltip(label, {
        permanent: true, direction: 'top', offset: [0, -6],
        className: 'sat-label-tip', opacity: 0.95
      });
    } else {
      mk.bindTooltip(label, {
        permanent: false, direction: 'top', offset: [0, -6],
        className: 'sat-label-tip', opacity: 0.95
      });
    }
  });
}

let skyAz=0, skyEl=45;

function createTextSprite(text,col,scale=1){
  const c=document.createElement('canvas');
  c.width=768; c.height=96;
  const ctx=c.getContext('2d');
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.font='500 36px system-ui,Segoe UI,Arial,sans-serif';
  const metrics = ctx.measureText(String(text));
  const textW = Math.min(740, metrics.width + 24);
  ctx.fillRect((768-textW)/2, 28, textW, 44);
  ctx.fillStyle=col;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(text), 384, 50);
  const tex=new THREE.CanvasTexture(c);
  const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false});
  const sp=new THREE.Sprite(mat);
  sp.scale.set(14*scale, 1.75*scale, 1);
  return sp;
}
/** Compact sat name/NORAD label (~map tooltip size). view: 'globe' | 'sky' */
function createSatLabelSprite(text, col, view){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 64;
  const ctx = c.getContext('2d');
  // ~10–11px feel like Leaflet .sat-label-tip
  ctx.font = '600 22px system-ui,Segoe UI,Arial,sans-serif';
  const t = String(text);
  const w = Math.min(500, ctx.measureText(t).width + 16);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect((512 - w) / 2, 16, w, 32);
  ctx.fillStyle = col || '#e2e8f0';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t, 256, 32);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sp = new THREE.Sprite(mat);
  // Globe: small (near Earth unit sphere). Sky: larger for readability.
  if (view === 'sky') sp.scale.set(22, 2.75, 1);
  else sp.scale.set(0.22, 0.028, 1);
  return sp;
}
function updateSkyFovLabel(){
  const el = document.getElementById('sky-view-label');

function azElToSky(az,el,r=85){
  const azR=az*DEG, elR=el*DEG;
  return new THREE.Vector3(
    Math.sin(azR)*Math.cos(elR)*r,
    Math.sin(elR)*r,
    -Math.cos(azR)*Math.cos(elR)*r
  );
}
