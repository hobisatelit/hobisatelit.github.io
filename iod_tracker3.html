    updateSimulation();
  });

  new ResizeObserver(resizeSky).observe(skyContainer);
  resizeSky();
  updateSkyCamera();
  updateSkyFovLabel();
  (function loop(){requestAnimationFrame(loop);skyRenderer.render(skyScene,skyCamera)})();
}
function resizeSky(){
  if (!skyContainer || !skyRenderer || !skyCamera) return;
  const parent = skyContainer.parentElement;
  let w = skyContainer.clientWidth || (parent && parent.clientWidth) || 0;
  let h = skyContainer.clientHeight || (parent && parent.clientHeight) || 0;
  if (w < 10) w = Math.max(window.innerWidth - 20, 300);
  if (h < 10) h = Math.max(Math.floor(window.innerHeight * 0.4), 220);
  skyCamera.aspect = w / h;
  skyCamera.updateProjectionMatrix();
  skyRenderer.setSize(w, h, false);
  skyRenderer.domElement.style.width = '100%';
  skyRenderer.domElement.style.height = '100%';
}
function updateSkyCamera(){
  const azR=skyAz*DEG, elR=skyEl*DEG;
  skyCamera.position.set(0,0,0);
  skyCamera.lookAt(Math.sin(azR)*Math.cos(elR), Math.sin(elR), -Math.cos(azR)*Math.cos(elR));
  skyCamera.up.set(0,1,0);
}

function focusSkyOnData(){
  if(Object.keys(satellites).length === 0) return;
  const jd = dateToJD(new Date(simTime || minTime));
  const lst = (gmst(jd) + observer.lon + 360) % 360;
  let sumAz = 0, sumEl = 0, count = 0;
  Object.values(satellites).forEach(sat=>{
    if (sat.source === 'tle' && sat.tle) {
      const p = propagateTLE(sat.tle, simTime || sat.tle.epochMs);
      const {az, el} = ecefToAzEl(p, observer);
      if (el > -5) { sumAz += az; sumEl += el; count++; }
    } else if (sat.obs) {
      sat.obs.forEach(o=>{
        const {az, el} = raDecToAzEl(o.ra, o.dec, observer.lat, lst);
        if(el > -5){ sumAz += az; sumEl += el; count++; }
      });
    }
  });
  if(count > 0){
    skyAz = sumAz / count;
    skyEl = Math.max(15, Math.min(75, sumEl / count));
    updateSkyCamera();
    updateSkyFovLabel();
  }
}

function updateSkyView(positions, satellites){
  while(skyStarGroup.children.length) skyStarGroup.remove(skyStarGroup.children[0]);
  while(skyConstGroup.children.length) skyConstGroup.remove(skyConstGroup.children[0]);
  while(skySatGroup.children.length) skySatGroup.remove(skySatGroup.children[0]);
  while(skyTrailGroup.children.length) skyTrailGroup.remove(skyTrailGroup.children[0]);
  while(skyLabelGroup.children.length) skyLabelGroup.remove(skyLabelGroup.children[0]);

  const jd = dateToJD(new Date(simTime));
  const lst = (gmst(jd) + observer.lon + 360) % 360;
  const lat = observer.lat;

  // Magnitude limit from slider only (not affected by zoom)
  const limit = magLimit;

  // Draw stars from catalog that are brighter than limit and above horizon
  // Positions use LST from IOD simulation time + observer lat/lon
  let drawn = 0;
  for (const s of HIP_STARS) {
    if (s.mag >= limit) break; // catalog is sorted by mag
    const {az, el} = raDecToAzEl(s.ra, s.dec, lat, lst);
    if (el < -2) continue;

    const pos = azElToSky(az, el, 92);
    const size = Math.max(0.05, 0.38 - s.mag * 0.035); // smaller star dots
    const day = getThemeMode() === 'light';
    let starCol;
    if (day) {
      // Day: dark grey stars on white sky
      const g = Math.max(0.25, 0.55 - s.mag * 0.04);
      starCol = new THREE.Color(g, g, g);
    } else {
      const b = Math.max(0.3, 1.15 - (s.mag + 1) * 0.1);
      starCol = new THREE.Color(b, b, b*0.95);
    }
    const mat = new THREE.MeshBasicMaterial({color: starCol});
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 6, 6), mat);
    mesh.position.copy(pos);
    skyStarGroup.add(mesh);
    drawn++;
  }

  // Constellations: real RA/Dec → Az/El at IOD time & observer location
  // (same sky the observer would see on that date)
  if (showConst) {
    Object.entries(CONSTELLATIONS).forEach(([name, verts]) => {
      const skyPts = []; // {pos, el} for each vertex
      verts.forEach(([ra, dec]) => {
        const {az, el} = raDecToAzEl(ra, dec, lat, lst);
        skyPts.push({ pos: azElToSky(az, el, 90), el, az });
      });

      // Draw line segments only between consecutive stars both above horizon
      for (let i = 0; i < skyPts.length - 1; i++) {
        const a = skyPts[i], b = skyPts[i + 1];
        if (a.el < -5 || b.el < -5) continue;
        skyConstGroup.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([a.pos, b.pos]),
          new THREE.LineBasicMaterial({color:0xa5b4fc, transparent:true, opacity:0.75})
        ));
      }

      // Markers + label only for stars above horizon
      const above = skyPts.filter(p => p.el > -5);
      if (above.length === 0) return;
      above.forEach(p => {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(0.45, 6, 6),
          new THREE.MeshBasicMaterial({color:0xc7d2fe})
        );
        m.position.copy(p.pos);
        skyConstGroup.add(m);
      });
      let ax=0, ay=0, az=0;
      above.forEach(p => { ax+=p.pos.x; ay+=p.pos.y; az+=p.pos.z; });
      ax/=above.length; ay/=above.length; az/=above.length;
      // Only label if average elevation is reasonably high
      const avgEl = above.reduce((s,p)=>s+p.el,0) / above.length;
      if (avgEl > 5) {
        const sp = createTextSprite(name, '#a5b4fc', 0.38);
        sp.position.set(ax, ay+3.5, az);
        skyConstGroup.add(sp);
      }
    });
  }

  const statusEl = document.getElementById('star-status');
  if (HIP_STARS.length) {
    statusEl.textContent = `Stars: ${drawn} visible (mag < ${limit.toFixed(1)})`;
  }

  // Satellite trails (IOD sight lines + TLE path in sky)
  Object.values(satellites).forEach(sat=>{
    if (sat.visible === false) return;
    const pts=[];
    if (sat.source === 'tle' && sat.tle) {
      const win = getIODTrackWindow();
      let t0, t1;
      if (win) {
        t0 = win.start; t1 = win.end;
      } else {
        const periodMs = sat.tle.periodMin * 60 * 1000;
        t0 = simTime - periodMs / 2;
        t1 = simTime + periodMs / 2;
      }
      for (let i = 0; i <= 80; i++) {
        const t = t0 + (i / 80) * (t1 - t0);
        const ecef = propagateTLE(sat.tle, t);
        if (!ecef) continue;
        const {az, el} = ecefToAzEl(ecef, observer);
        if (el > -5) pts.push(azElToSky(az, el));
      }
    } else if (sat.obs && sat.obs.length) {
      // IOD trail: each observation at its own epoch LST (path as actually seen)
      for (let i = 0; i < sat.obs.length; i++) {
        const o = sat.obs[i];
        const jdO = dateToJD(o.utc || new Date(o.timeMs));
        const lstO = (gmst(jdO) + observer.lon + 360) % 360;
        const { az, el } = raDecToAzEl(o.ra, o.dec, lat, lstO);
        if (el > -5) pts.push(azElToSky(az, el));
        // Dense samples between observations
        if (i < sat.obs.length - 1) {
          const o2 = sat.obs[i + 1];
          const nStep = 8;
          for (let s = 1; s < nStep; s++) {
            const frac = s / nStep;
            const { ra, dec } = interpRaDec(o.ra, o.dec, o2.ra, o2.dec, frac);
            const tMid = o.timeMs + frac * (o2.timeMs - o.timeMs);
            const jdM = dateToJD(new Date(tMid));
            const lstM = (gmst(jdM) + observer.lon + 360) % 360;
            const ae = raDecToAzEl(ra, dec, lat, lstM);
            if (ae.el > -5) pts.push(azElToSky(ae.az, ae.el));
          }
        }
      }
    }
    if(pts.length>=2){
      skyTrailGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:sat.color, transparent:true, opacity:0.9})
      ));
    }
  });

  const rBall = Math.max(0.4, 1.5 * satSize);
  positions.forEach(p=>{
    if(!p) return;
    const sat = satellites[p.id];
    if(!sat) return;
    let az, el;
    if (sat.source === 'tle') {
      const ae = ecefToAzEl(p, observer);
      az = ae.az; el = ae.el;
    } else {
      // IOD: use interpolated RA/Dec at simTime with current sky LST
      if (!sat.obs || !sat.obs.length) return;
      let ra, dec;
      if (p.ra != null && p.dec != null) {
        ra = p.ra; dec = p.dec;
      } else {
        const usedAlt = sat.estimatedAlt != null ? sat.estimatedAlt : fallbackAlt;
        const pi = computePositionAtTime(sat.obs, simTime, usedAlt, observer);
        if (!pi) return;
        ra = pi.ra; dec = pi.dec;
      }
      const ae = raDecToAzEl(ra, dec, lat, lst);
      az = ae.az; el = ae.el;
    }
    if(el < -2) return;
    const pos = azElToSky(az, el, 82);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(rBall,12,12),
      new THREE.MeshBasicMaterial({color:p.color}));
    ball.position.copy(pos);
    ball.userData = { satId: p.id, isSat: true };
    skySatGroup.add(ball);
    const glow = new THREE.Mesh(new THREE.SphereGeometry(rBall*1.9,8,8),
      new THREE.MeshBasicMaterial({color:p.color, transparent:true, opacity:0.22}));
    glow.position.copy(pos); skySatGroup.add(glow);
    const labelText = satDisplayLabel(p.labelId || p.id);
    if (showSatLabels || hoveredSatId === p.id) {
      const sp = createSatLabelSprite(labelText, p.color || '#e2e8f0', 'sky');
      sp.position.copy(pos);
      sp.position.y += rBall * 3 + 3;
      skySatGroup.add(sp);
    }
  });

  if(showBodies){
    const sun = sunRaDec(jd);
    const moon = moonRaDec(jd);
    [{name:'Sun', ra:sun.ra, dec:sun.dec, col:'#fde047'},
     {name:'Moon', ra:moon.ra, dec:moon.dec, col:'#e2e8f0'}].forEach(body=>{
      const {az,el} = raDecToAzEl(body.ra, body.dec, lat, lst);
      if(el < 0) return;
      const pos = azElToSky(az, el, 80);
      const sp = createTextSprite(body.name, body.col, 0.7);
      sp.position.copy(pos); sp.position.y += 5;
      skyLabelGroup.add(sp);
      const m = new THREE.Mesh(new THREE.SphereGeometry(1.2,10,10),
        new THREE.MeshBasicMaterial({color:body.col}));
      m.position.copy(pos); skyLabelGroup.add(m);
    });
  }
}

/* ============================================================
   Core
   ============================================================ */
/** Normalize NORAD for comparison (strip leading zeros) */
function noradKey(id){
  const s = String(id || '').replace(/^(iod:|tle:)/, '').replace(/\s/g, '');
  const n = parseInt(s, 10);
  return isFinite(n) ? String(n) : s;
}

/** Visible TLE card sharing the same NORAD as this sat (if any) */
function findVisibleTLEForNorad(norad){
  const key = noradKey(norad);
  if (!key) return null;
  for (const sat of Object.values(satellites)) {
    if (sat.source !== 'tle' || !sat.tle || sat.visible === false) continue;
    if (noradKey(sat.norad || sat.id) === key) return sat;
  }
  return null;
}

/** TLE ECEF position at timeMs for matching visible TLE, else null */
function tleECEFAt(norad, timeMs){
  const tleSat = findVisibleTLEForNorad(norad);
  if (!tleSat || !tleSat.tle) return null;
  return propagateTLE(tleSat.tle, timeMs);
}

/**
 * Slant range [km] from matching visible TLE at timeMs:
 * ρ = |r_TLE − r_obs|
 */
function tleSlantRangeAt(norad, timeMs){
  const p = tleECEFAt(norad, timeMs);
  if (!p) return null;
  return slantRangeKm(p, observer);
}

/**
 * IOD position at time: prefer TLE slant range along measured LOS;
 * else altitude-sphere from optical estimate / fallback.
 */
function iodPositionAt(sat, timeMs){
  const obsList = sat.obs;
  if (!obsList || !obsList.length) return null;
  const t = timeMs != null ? timeMs : simTime;
  const stub = interpObsAtTime(obsList, t);
  if (!stub) return null;

  const norad = sat.norad || sat.id;
  const rhoTle = tleSlantRangeAt(norad, t);
  if (rhoTle != null && isFinite(rhoTle) && rhoTle > 10) {
    sat.rangeFromTle = true;
    const p = computePositionFromSlantRange(stub, rhoTle, observer);
    if (p) return p;
  }
  sat.rangeFromTle = false;
  const alt = sat.estimatedAlt != null ? sat.estimatedAlt
    : (sat.opticalAlt != null ? sat.opticalAlt : fallbackAlt);
  return computePositionAtTime(obsList, t, alt, observer);
}

function getSatelliteState(sat,t){
  // Optical IOD observations take priority when present
  const obs = sat.obs;
  if (obs && obs.length) {
    // fall through to IOD path below
  } else if (sat.tle) {
    const p = propagateTLE(sat.tle, t);
    if (!p) return null;
    const alt = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z) - RE;
    const rho = slantRangeKm(p, observer);
    return {
      ...p, id: sat.id, color: sat.color,
      usedAlt: alt, slantRange: rho,
      incl: sat.inclination, source: 'tle'
    };
  }
  if(!obs || !obs.length) return null;
  const p = iodPositionAt(sat, t);
  if (!p) return null;
  return {
    ...p,
    id: sat.id,
    color: sat.color,
    usedAlt: p.altitude != null ? p.altitude : sat.estimatedAlt,
    slantRange: p.slantRange,
    incl: sat.inclination,
    source: 'iod',
    rangeFromTle: !!sat.rangeFromTle
  };
}

function loadObservations(){
  const text = document.getElementById('iod-input').value;
  // Preserve leading spaces (IOD is fixed-column); only strip trailing whitespace
  const rawLines = text.split(/\r?\n/)
    .map(l => l.replace(/\r/g, '').replace(/\s+$/, ''))
    .filter(l => l.length > 0);
  // Remember visibility so TLE show/hide can rebuild IOD tracks without resetting cards
  const prevVis = {};
  Object.entries(satellites).forEach(([id, s]) => { prevVis[id] = s.visible !== false; });
  observations = []; satellites = {};

  applyDefaultStationToObserver();
  fallbackAlt = parseFloat(document.getElementById('sat-alt').value) || 500;

  // Parse mixed IOD + TLE (optional name, line1, line2)
  let pendingName = null;
  for (let i = 0; i < rawLines.length; i++) {
    const line = rawLines[i];
    const tline = line.trim();
    // TLE pair — always a separate card (key tle:NORAD), never merged with IOD
    if (/^1\s/.test(tline) && i + 1 < rawLines.length && /^2\s/.test(rawLines[i + 1].trim())) {
      const tle = parseTLE(tline, rawLines[i + 1].trim(), pendingName);
      pendingName = null;
      i++;
      if (!tle) continue;
      const norad = tle.norad.replace(/\s/g, '') || tle.norad;
      if (tle.name) SAT_NAMES[normalizeNorad(norad)] = tle.name;
      const tid = 'tle:' + norad;
      if (!satellites[tid]) {
        satellites[tid] = {
          id: tid, norad, source: 'tle', tle, obs: [], visible: true,
          color: colors[Object.keys(satellites).length % colors.length],
          estimatedAlt: tle.a - RE,
          eccentricity: tle.ecc,
          inclination: tle.incl,
          periodMin: tle.periodMin,
          orbitPoints: null, groundTrack: null, iodTrack: null
        };
      } else {
        const s = satellites[tid];
        s.tle = tle; s.visible = true; s.norad = norad;
        s.estimatedAlt = tle.a - RE;
        s.eccentricity = tle.ecc;
        s.inclination = tle.incl;
        s.periodMin = tle.periodMin;
      }
      continue;
    }
    if (/^2\s/.test(tline)) { pendingName = null; continue; }

    // IOD observation — separate card (key iod:NORAD or plain NORAD)
    const o = parseIOD(line);
    if (o) {
      pendingName = null;
      observations.push(o);
      const norad = String(o.object);
      const oid = 'iod:' + norad;
      if (!satellites[oid]) {
        satellites[oid] = {
          id: oid, norad, source: 'iod', obs: [], visible: true,
          color: colors[Object.keys(satellites).length % colors.length],
          estimatedAlt: null, eccentricity: null, inclination: null, periodMin: null,
          orbitPoints: null, groundTrack: null, iodTrack: null
        };
      }
      satellites[oid].obs.push(o);
      continue;
    }

    // Possible satellite name line for following TLE
    if (tline.length < 40 && !/^\d{5}/.test(tline) && !/^1\s/.test(tline) && !/^2\s/.test(tline)) {
      pendingName = tline;
    } else {
      pendingName = null;
    }
  }

  Object.values(satellites).forEach(s => {
    if (s.obs && s.obs.length) s.obs.sort((a, b) => a.timeMs - b.timeMs);
  });
  // Restore previous show/hide state
  Object.entries(satellites).forEach(([id, s]) => {
    if (prevVis[id] === false) s.visible = false;
  });

  clearOrbits();
  Object.entries(satellites).forEach(([id, sat]) => {
    try {
      // Prefer optical IOD path when observations exist
      if (sat.obs && sat.obs.length > 0) {
        sat.source = 'iod';
        // 1) Optical-only elements (incl/ecc/period) — never from TLE
        let opticalAlt = null;
        if (sat.obs.length >= 2) {
          const res = estimateCircularAltitude(sat.obs, observer);
          if (res) opticalAlt = res.altitude;
        }
        const altForElements = opticalAlt != null ? opticalAlt : fallbackAlt;
        const elems = estimateElements(sat.obs, altForElements, observer);
        if (elems) {
          // Freeze IOD-only inclination (real optical geometry)
          sat.inclination = elems.inclination;
          sat.iodInclination = elems.inclination;
          sat.eccentricity = elems.eccentricity;
          sat.periodMin = elems.periodMin;
          sat.opticalPlaneNormal = elems.planeNormal || null;
          if (elems.altitude != null && opticalAlt == null) opticalAlt = elems.altitude;
        }
        sat.opticalAlt = opticalAlt;

        // 2) Matching TLE: slant range + eccentricity for track (inclination stays IOD)
        const tleMatch = findVisibleTLEForNorad(sat.norad || sat.id);
        sat.rangeFromTle = !!tleMatch;
        sat.eccFromTle = false;
        sat.estimatedAlt = opticalAlt != null ? opticalAlt : fallbackAlt;
        if (tleMatch && tleMatch.tle) {
          if (tleMatch.tle.ecc != null && isFinite(tleMatch.tle.ecc)) {
            sat.eccentricity = tleMatch.tle.ecc;
            sat.eccFromTle = true;
          } else if (tleMatch.eccentricity != null) {
            sat.eccentricity = tleMatch.eccentricity;
            sat.eccFromTle = true;
          }
          sat.tleA = tleMatch.tle.a;
          sat.tleE = tleMatch.tle.ecc;
          // Representative slant range at mid-pass for card
          const tMid = sat.obs[Math.floor(sat.obs.length / 2)].timeMs;
          const rho0 = tleSlantRangeAt(sat.norad || sat.id, tMid);
          if (rho0 != null) sat.slantRange = rho0;
        } else {
          sat.tleA = null;
          sat.tleE = null;
        }
        // Dense IOD track: TLE slant range along LOS when linked, else altitude sphere
        const latlngs = [];
        const orbitSeg = [];
        for (let i = 0; i < sat.obs.length; i++) {
          const p = iodPositionAt(sat, sat.obs[i].timeMs);
          if (p) {
            latlngs.push([p.lat, p.lon]);
            orbitSeg.push(p);
            if (p.slantRange != null) sat.slantRange = p.slantRange;
          }
          if (i < sat.obs.length - 1) {
            const t0 = sat.obs[i].timeMs, t1 = sat.obs[i + 1].timeMs;
            const nStep = Math.max(2, Math.min(24, Math.round((t1 - t0) / 5000)));
            for (let s = 1; s < nStep; s++) {
              const t = t0 + (s / nStep) * (t1 - t0);
              const pi = iodPositionAt(sat, t);
              if (pi) {
                latlngs.push([pi.lat, pi.lon]);
                orbitSeg.push(pi);
              }
            }
          }
        }
        sat.iodTrack = { latlngs, color: sat.color, solid: true };
        // Orbital plane: IOD plane (inclination) + TLE a,e when linked, else circular at optical alt
        const hOpt = opticalAlt != null ? opticalAlt : fallbackAlt;
        if (sat.obs.length >= 2) {
          // Plane from optical positions (inclination from IOD)
          const pA = computePosition(sat.obs[0], hOpt, observer);
          const pB = computePosition(sat.obs[sat.obs.length - 1], hOpt, observer);
          if (pA && pB) {
            if (sat.eccFromTle && sat.tleA > RE && sat.tleE != null) {
              sat.orbitPoints = generateEllipticalOrbitPoints(pA, pB, sat.tleA, sat.tleE, 200);
            } else if (hOpt > 50) {
              sat.orbitPoints = generateOrbitPoints(pA, pB, RE + hOpt, 200);
            }
            if (sat.orbitPoints) {
              sat.groundTrack = sat.orbitPoints.map(p => {
                const ll = ecefToLatLon(p);
                return { lat: ll.lat, lon: ll.lon };
              });
              sat.groundTrack.color = sat.color;
              drawOrbit(sat.orbitPoints, sat.color);
            }
          }
        } else if (orbitSeg.length >= 2) {
          sat.orbitPoints = orbitSeg.map(p => ({ x: p.x, y: p.y, z: p.z }));
          drawOrbit(sat.orbitPoints, sat.color);
        }
        return;
      }

      // Pure TLE card
      if (sat.source === 'tle' && sat.tle) {
        refreshTLEOrbit(sat, simTime || sat.tle.epochMs);
        if (sat.orbitPoints) drawOrbit(sat.orbitPoints, sat.color);
      }
    } catch (err) {
      console.warn('Orbit build failed for', id, err);
    }
  });

  const hasAny = Object.keys(satellites).length > 0;
  if (!hasAny) {
    document.getElementById('status').textContent = 'No valid IOD or TLE data';
    return;
  }

  // Time slider: first IOD → last IOD; if equal, last = first + 5 min
  // (TLE-only: epoch ± half period)
  if (observations.length > 0) {
    const iodTimes = observations.map(o => o.timeMs).filter(isFinite);
    minTime = Math.min(...iodTimes);
    maxTime = Math.max(...iodTimes);
    if (maxTime <= minTime) maxTime = minTime + 5 * 60 * 1000;
    simTime = minTime;
  } else {
    const times = [];
    Object.values(satellites).forEach(sat => {
      if (sat.tle) {
        const half = Math.max(sat.tle.periodMin * 60 * 1000, 30 * 60 * 1000);
        times.push(sat.tle.epochMs - half);
        times.push(sat.tle.epochMs + half);
      }
    });
    if (times.length) {
      minTime = Math.min(...times);
      maxTime = Math.max(...times);
    } else {
      minTime = Date.now();
      maxTime = minTime + 5 * 60 * 1000;
    }
    if (maxTime - minTime < 5 * 60 * 1000) maxTime = minTime + 5 * 60 * 1000;
    simTime = minTime;
  }
  document.getElementById('time-slider').value = 0;

  const list = document.getElementById('sat-list');
  list.innerHTML = '';
  Object.entries(satellites).forEach(([id, s]) => {
    if (s.visible === undefined) s.visible = true;
    const div = document.createElement('div');
    div.className = 'sat-item' + (s.visible ? '' : ' hidden-sat');
    div.dataset.satId = id;
    div.title = 'Click to show / hide on globe, map, and sky';
    const norad = s.norad || id.replace(/^(iod:|tle:)/, '');
    const disp = satDisplayLabel(norad);
    const kind = s.source === 'tle' ? 'TLE' : ((s.obs && s.obs.length) + ' obs');
    let html = `<div class="sat-header"><span class="dot" style="background:${s.visible ? s.color : '#888'}"></span><strong style="font-size:.8rem">${disp}</strong> <span style="color:var(--muted);font-size:.7rem">${s.source === 'tle' ? 'TLE' : 'IOD'}</span> (${kind})</div>`;
    // Slant range (observer → sat); updates with time slider
    let rangeNote = '';
    if (s.source === 'tle') rangeNote = ' <span style="color:var(--muted);font-size:.65rem">(at slider)</span>';
    else if (s.rangeFromTle) rangeNote = ' <span style="color:var(--accent);font-size:.65rem">(from TLE)</span>';
    else rangeNote = ' <span style="color:var(--muted);font-size:.65rem">(est.)</span>';
    const initRho = s.slantRange != null ? s.slantRange : 0;
    html += `<div class="param">Slant ≈ <span class="sat-range-val" data-sat-id="${id}">${initRho > 0 ? initRho.toFixed(0) : '—'}</span> km${rangeNote}</div>`;
    const inclShow = s.iodInclination != null ? s.iodInclination : s.inclination;
    if (inclShow != null) {
      html += `<div class="param">Incl ≈ <span class="i">${inclShow.toFixed(1)}°</span>` +
        (s.source === 'iod' ? ' <span style="color:var(--muted);font-size:.65rem">(IOD)</span>' : '') +
        `</div>`;
    }
    if (s.eccentricity != null) {
      let eccNote = '';
      if (s.source === 'iod') {
        eccNote = s.eccFromTle
          ? ' <span style="color:var(--accent);font-size:.65rem">(from TLE)</span>'
          : ' <span style="color:var(--muted);font-size:.65rem">(IOD)</span>';
      }
      html += `<div class="param">Ecc ≈ <span class="e">${s.eccentricity.toFixed(4)}</span>${eccNote}</div>`;
    }
    if (s.periodMin != null) html += `<div class="param">Period ≈ <span>${s.periodMin.toFixed(1)} min</span>` +
      (s.source === 'iod' ? ' <span style="color:var(--muted);font-size:.65rem">(IOD)</span>' : '') + `</div>`;
    html += `<div class="vis-hint">${s.visible ? 'Visible — click to hide' : 'Hidden — click to show'}</div>`;
    div.innerHTML = html;
    div.addEventListener('click', () => {
      s.visible = !s.visible;
      div.classList.toggle('hidden-sat', !s.visible);
      const dot = div.querySelector('.dot');
      if (dot) dot.style.background = s.visible ? s.color : '#888';
      const hint = div.querySelector('.vis-hint');
      if (hint) hint.textContent = s.visible ? 'Visible — click to hide' : 'Hidden — click to show';
      // Toggling TLE visibility can change IOD altitude linking — rebuild tracks
      if (s.source === 'tle') {
        loadObservations();
        return;
      }
      clearOrbits();
      Object.values(satellites).forEach(sat => {
        if (sat.visible !== false && sat.orbitPoints) drawOrbit(sat.orbitPoints, sat.color);
      });
      updateSimulation();
    });
    list.appendChild(div);
  });
  const nIod = observations.length;
  const nTle = Object.values(satellites).filter(s => s.source === 'tle').length;
  document.getElementById('status').textContent =
    `Loaded ${nIod} IOD · ${nTle} TLE · ${Object.keys(satellites).length} object(s)`;

  const iodTracks = Object.values(satellites).filter(s => s.iodTrack).map(s => s.iodTrack);
  setTimeout(() => {
    fitMapToData(iodTracks);
    focusGlobeOnData();
    focusSkyOnData();
  }, 400);

  updateSimulation();
}

function updateSatCardSlantRanges(positionsById){
  document.querySelectorAll('.sat-range-val').forEach(el => {
    const id = el.getAttribute('data-sat-id');
    const sat = satellites[id];
    if (!sat) return;
    if (sat.source === 'tle' && sat.tle) {
      const p = positionsById && positionsById[id]
        ? positionsById[id]
        : propagateTLE(sat.tle, simTime);
      if (p) {
        const rho = p.slantRange != null ? p.slantRange : slantRangeKm(p, observer);
        el.textContent = rho.toFixed(1);
        sat.slantRange = rho;
      }
    } else if (sat.source === 'iod' && sat.obs) {
      const p = positionsById && positionsById[id]
        ? positionsById[id]
        : iodPositionAt(sat, simTime);
      if (p && p.slantRange != null) {
        el.textContent = p.slantRange.toFixed(1);
        sat.slantRange = p.slantRange;
      } else if (p) {
        const rho = slantRangeKm(p, observer);
        el.textContent = rho.toFixed(1);
        sat.slantRange = rho;
      }
    }
  });
}

function updateSimulation(){
  // TLE: rebuild orbital plane + ground track at current slider time
  let needRedrawOrbits = false;
  Object.values(satellites).forEach(sat => {
    if (sat.visible === false) return;
    if (sat.source === 'tle' && sat.tle) {
      refreshTLEOrbit(sat, simTime);
      needRedrawOrbits = true;
    }
  });
  if (needRedrawOrbits) {
    clearOrbits();
    Object.values(satellites).forEach(sat => {
      if (sat.visible === false) return;
      if (sat.orbitPoints && sat.orbitPoints.length) drawOrbit(sat.orbitPoints, sat.color);
    });
  }

  const positionsById = {};
  const positions = Object.entries(satellites).map(([id,sat])=>{
    if (sat.visible === false) return null;
    const st = getSatelliteState(sat, simTime);
    if(st) {
      st.id = id;
      // Labels use NORAD / name, not internal key
      st.labelId = sat.norad || id.replace(/^(iod:|tle:)/, '');
      positionsById[id] = st;
    }
    return st;
  }).filter(Boolean);

  // TLE card altitude follows time slider
  updateSatCardSlantRanges(positionsById);

  const orbitTracks = Object.values(satellites)
    .filter(s => s.visible !== false && s.groundTrack)
    .map(s => s.groundTrack);
  const iodTracks = Object.values(satellites)
    .filter(s => s.visible !== false && s.iodTrack)
    .map(s => s.iodTrack);

  updateGlobePositions(positions);
  updateMap(positions, orbitTracks, iodTracks);
  updateSkyView(positions, satellites);

  const d = new Date(simTime);
  document.getElementById('time-display').textContent =
    d.toISOString().replace('T',' ').slice(0,23) + ' UTC';
  const frac = (simTime - minTime) / (maxTime - minTime || 1);
  document.getElementById('time-slider').value = Math.round(Math.max(0, Math.min(1000, frac*1000)));
}

function tick(now){
  requestAnimationFrame(tick);
  if (!lastFrame) lastFrame = now;
  // dt in ms; clamp so background tabs don't jump
  let dt = now - lastFrame;
  lastFrame = now;
  if (dt < 0) dt = 0;
  if (dt > 50) dt = 50; // smooth max ~20 fps worth of advance per frame

  if (playing && maxTime > minTime) {
    const speed = parseFloat(document.getElementById('speed').value) || 1;
    // 1× = real time (1 wall-ms → 1 sim-ms)
    simTime += dt * speed;
    if (simTime >= maxTime) {
      simTime = maxTime;
      playing = false;
      const btn = document.getElementById('btn-play');
      if (btn) { btn.textContent = 'Play'; btn.classList.remove('active'); }
    } else if (simTime <= minTime) {
      simTime = minTime;
      playing = false;
      const btn = document.getElementById('btn-play');
      if (btn) { btn.textContent = 'Play'; btn.classList.remove('active'); }
    }
    updateSimulation();
  }
}

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {

        else if (panel.webkitRequestFullscreen) panel.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();

    } catch (e) { console.warn('fullscreen', e); }
    setTimeout(() => {

      if (typeof resizeGlobe === 'function') resizeGlobe();
      if (typeof resizeSky === 'function') resizeSky();

/* ---- Drag-to-resize panel heights ---- */
(function setupViewResize(){
  const MIN_H = 140, MAX_H = () => Math.floor(window.innerHeight * 0.85);
  document.querySelectorAll('.view-resize').forEach(handle => {
    const view = handle.parentElement;
    let startY = 0, startH = 0, active = false;

    function onDown(clientY){
      active = true;
      startY = clientY;
      startH = view.getBoundingClientRect().height;
      handle.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'ns-resize';
      // Leave equal-flex layout and lock this panel to a fixed height
      view.style.flex = '0 0 auto';
      view.style.height = startH + 'px';
    }
    function onMove(clientY){
      if (!active) return;
      const dy = clientY - startY;
      const h = Math.max(MIN_H, Math.min(MAX_H(), startH + dy));
      view.style.height = h + 'px';
      view.style.flex = '0 0 auto';
      if (typeof forceViewResize === 'function') forceViewResize();
      else {
        if (typeof resizeGlobe === 'function') resizeGlobe();
        if (typeof resizeSky === 'function') resizeSky();
        if (typeof map !== 'undefined' && map) try { map.invalidateSize(true); } catch(e) {}
      }
    }
    function onUp(){
      if (!active) return;
      active = false;
      handle.classList.remove('dragging');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      if (typeof forceViewResize === 'function') forceViewResize();
    }

    handle.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      handle.setPointerCapture(e.pointerId);
      onDown(e.clientY);
    });
    handle.addEventListener('pointermove', e => {
      if (!active) return;
      e.preventDefault();
      onMove(e.clientY);
    });
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  });
})();

/* ---- Mobile / tablet UI: view tabs + collapsible input ---- */
(function setupResponsiveUI(){
  const tabs = document.querySelectorAll('#view-tabs button');
  const views = document.querySelectorAll('.views .view');

  function showView(name){
    views.forEach(v => {
      const on = v.dataset.view === name;
      v.classList.toggle('active', on);
    });
    tabs.forEach(t => {
      const on = t.dataset.view === name;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    // Force resize after tab switch so Three.js / Leaflet fill the panel
    setTimeout(() => {
      window.dispatchEvent(new Event('resize'));
      if (typeof resizeGlobe === 'function') resizeGlobe();
      if (typeof resizeSky === 'function') resizeSky();
      if (map) map.invalidateSize();
    }, 50);
  }

  tabs.forEach(t => t.addEventListener('click', () => showView(t.dataset.view)));

  function afterPanelToggle(){
    setTimeout(() => {
      if (typeof resizeGlobe === 'function') resizeGlobe();
      if (typeof resizeSky === 'function') resizeSky();
      if (map) try { map.invalidateSize(); } catch (e) {}
    }, 50);
  }

  // Collapsible Settings panel
  const setPanel = document.getElementById('settings-panel');
  const setBtn = document.getElementById('btn-toggle-settings');
  const setChev = document.getElementById('settings-chevron');
  if (setBtn && setPanel) {
    setBtn.addEventListener('click', () => {
      setPanel.classList.toggle('collapsed');
      const open = !setPanel.classList.contains('collapsed');
      setBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (setChev) setChev.textContent = open ? '▾' : '▸';
      afterPanelToggle();
    });
    // Default collapsed
    setPanel.classList.add('collapsed');
    setBtn.setAttribute('aria-expanded', 'false');
    if (setChev) setChev.textContent = '▸';
  }

  // Collapsible IOD input
  const panel = document.getElementById('input-panel');
  const btn = document.getElementById('btn-toggle-input');
  const chev = document.getElementById('input-chevron');
  btn.addEventListener('click', () => {
    panel.classList.toggle('collapsed');
    const open = !panel.classList.contains('collapsed');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    chev.textContent = open ? '▾' : '▸';
    afterPanelToggle();
  });

  // IOD input open by default
  panel.classList.remove('collapsed');
  btn.setAttribute('aria-expanded', 'true');
  chev.textContent = '▾';

  // Phone portrait only: tabbed single view
  const phonePortrait = window.matchMedia('(max-width:699px) and (orientation: portrait)');
  if (phonePortrait.matches) {
    showView('globe');
  }
})();
